        label:
          type: string
          example: Menu label
          description: Menu label.
        icon:
          type: string
          example: menu_icon
          description: Menu icon. You can chose from MUI icons (https://mui.com/material-ui/material-icons).
        color:
          $ref: '#/components/schemas/ColorType'
        priority:
          type: integer
          example: 100
          description: Menu priority defines order of the menu item in the menu.
        type:
          $ref: '#/components/schemas/MenuType'
        parent:
          oneOf:
            - $ref: '#/components/schemas/MenuGroupSchema'
          description: Parent menu group. Group is shown as the root if parent is not set.
        view:
          $ref: '#/components/schemas/ViewActionParameters'
        link:
          $ref: '#/components/schemas/LinkActionParameters'
    GlobalResourceSchema:
      type: object
      readOnly: true
      description: |
        Represents schema of one resource. Resource schema defines name, label, 
        list of supported views, name of the pk field, list of supported actions and menu schema.
      properties:
        name:
          type: string
          example: resource_name
