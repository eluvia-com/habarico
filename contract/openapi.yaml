            When true, this resource is included in the application-wide fulltext search across
            all registered admins. Does not affect search within the resource's own list view.
        aggregate_enabled:
          type: boolean
          example: false
          description: |
            **Premium** — contributed by the paid `habarico-enterprise` package; absent from a
            free-only install.

            When true, this resource exposes the aggregate endpoint at
            `/{api_prefix}/{service_name}/admin/{resource_name}/aggregate` and the
            companion schema endpoint at `.../aggregate/schema`. Default false – admin
            opts in per-resource. Resources without the opt-in return HTTP 404 for both.
        dashboard_enabled:
          type: boolean
          example: false
          description: |
            **Premium** — contributed by the paid `habarico-enterprise` package; absent from a
            free-only install.

            When true, this resource can be used for a dashboard. Default false – admin opts in
            per-resource.
    ObjectResourceSchema:
      type: object
      readOnly: true
      description: |
        Represents schema of one resource. Resource schema defines name, label, 
        list of supported views, name of the pk field, list of supported actions and menu schema.
      properties:
        name:
          type: string
          example: resource_name
          description: Resource name must be unique within the service.
        label:
          type: string
          example: Resource label
          description: Resource label.
        pk_field_name:
          type: string
          example: id
          description: Name of the primary key field of the resource.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceActionSchema'
          description: List of supported actions for the resource. Only actions allowed for concreate response (detail, list) are returned.
      required:
