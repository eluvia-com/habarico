          example: Resource label
          description: Resource label.
        pk_field_name:
          type: string
          example: id
          description: Name of the primary key field of the resource.
        views:
          type: array
          items:
            $ref: '#/components/schemas/GlobalViewSchema'
          description: List of supported views for the resource.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GlobalResourceActionSchema'
          description: List of supported actions for the resource.
        menu:
          oneOf:
            - $ref: '#/components/schemas/MenuSchema'
          description: Menu schema for the resource.
          example:
            label: Menu label
            icon: Abc
            priority: 10
