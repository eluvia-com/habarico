        - pk_field_name
        - actions
    SearchResourceSchema:
      type: object
      readOnly: true
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Represents schema of one resource. Resource schema defines name, label,
      properties:
        name:
          type: string
          example: resource_name
          description: Resource name must be unique within the service.
        label:
          type: string
          example: Resource label
          description: Resource label.
        icon:
          type: string
          example: resource_icon
          description: Resource icon. You can chose from MUI icons (https://mui.com/material-ui/material-icons).
    BoxSchema:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BoxType'
        name:
          type: string
          example: box_name
          description: Box name, must be unique within the resource.
        label:
          type: string
          example: Box label
          description: Box label
        card:
          type: boolean
          nullable: true
          example: true
          description: |
            Whether the box is displayed as a card. Three states: `true` always renders the card,
            `false` never does - not even when the box has a label or toolbar actions, in which case
            the label becomes a plain section heading - and `null` (or an absent key) leaves the
            decision to the frontend. Unset, a box takes the card when it has a label, toolbar
            actions or is collapsible, and additionally when it is the first box of a view rendered
            on a page surface. A layout box holding no fields of its own (a grid, a tab or wizard
            step, a bare wrapper) hands that default down to its children instead, so the card lands
            on the first box that actually holds content. Inside a dialog or a side panel the
            overlay itself is the card, so nothing takes the default.
        collapsible:
          type: string
          nullable: true
          example: open
          enum:
            - open
            - closed
          description: |
            Makes the box collapsible and sets the state it is rendered in. Null means the box is not
            collapsible. A collapsible box keeps its header even without a label, because the header
            hosts the toggle.
        boxes:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/BoxSchema'
              - $ref: '#/components/schemas/FieldDescriptor'
              - type: array
                items:
                  $ref: '#/components/schemas/FieldDescriptor'
          description: List of boxes and fields
        read_only:
          type: boolean
          example: false
          description: |
            Defines if box is only read-only.
            Value is used for example for rendering save button in the form.
        toolbar_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered in the box's toolbar (top of the box / card header area). On a plain box
            the toolbar is always visible; on a step container (tab/wizard) the actions appear on the
            last step. Absent when not configured.
          nullable: true
        bottom_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered at the bottom of the box, below the fields — similar to form submit buttons
            at the view level. Absent when not configured.
          nullable: true
        tab:
          $ref: '#/components/schemas/TabBoxParameters'
        wizard:
          $ref: '#/components/schemas/WizardBoxParameters'
        grid_item:
          $ref: '#/components/schemas/GridItemBoxParameters'
        list:
          $ref: '#/components/schemas/ListBoxParameters'
        object:
          $ref: '#/components/schemas/ObjectBoxParameters'
        array:
          $ref: '#/components/schemas/ArrayBoxParameters'
        gallery:
          $ref: '#/components/schemas/GalleryBoxParameters'
        options:
          $ref: '#/components/schemas/BoxOptions'
      required:
        - type
    FieldSchema:
      type: object
      properties:
        name:
          type: string
          example: field_name
          description: Field name.
        type:
          $ref: '#/components/schemas/FieldType'
        format:
          $ref: '#/components/schemas/FieldFormatType'
        label:
          type: string
          example: Field label
          description: Field label.
          nullable: true
        short_label:
          type: string
          example: Field
          description: Shorter field label, used where space is tight - for example a list column header.
          nullable: true
        help_text:
          type: string
          example: Field help text
          description: Field help text.
          nullable: true
        read_only:
          type: boolean
          example: false
          description: Defines if field is read-only.
        write_only:
          type: boolean
          example: false
          description: Defines if field is write-only.
        nullable:
          type: boolean
          example: false
          description: Defines if field is nullable.
        required:
          type: boolean
          example: false
          description: Defines if field is required.
        default_value:
          example: default_value
          description: Default field value.
        sortable:
          type: boolean
          example: false
          description: Defines if field is sortable.
        sort_by:
          type: string
          example: field_name
          description: Field name used for sorting. If not set, field name is used.
        reference:
          $ref: '#/components/schemas/ReferenceType'
        enum:
          $ref: '#/components/schemas/EnumType'
        items:
          oneOf:
            - $ref: '#/components/schemas/FieldSchema'
          description: List of field items. Used for array type.
        properties:
          type: array
          description: |
            Array of field properties. Properties are used for object type fields.
          items:
            $ref: '#/components/schemas/FieldSchema'
          nullable: true
        options:
          $ref: '#/components/schemas/FieldOptions'
      required:
        - type
        - required
        - nullable
        - read_only
        - write_only
        - sortable
    FilterSchema:
      description: |
        Filter schema is used for describing filter that resource supports.
      type: object
      properties:
        name:
          type: string
          example: Filter name
          description: Filter name.
        type:
          $ref: '#/components/schemas/FieldType'
        format:
          $ref: '#/components/schemas/FieldFormatType'
        label:
          type: string
          example: Filter label
          description: Filter label.
          nullable: true
        help_text:
          type: string
          example: Filter help text
          description: Filter help text.
          nullable: true
        default_value:
          example: default_value
          description: Default filter value.
        reference:
          $ref: '#/components/schemas/ReferenceType'
        enum:
          $ref: '#/components/schemas/EnumType'
        items:
          oneOf:
            - $ref: '#/components/schemas/FilterSchema'
          description: List of field items. Used for array type.
        properties:
          type: object
          description: |
            Object with field properties. Properties are used for object type fields.
          additionalProperties:
            $ref: '#/components/schemas/FilterSchema'
          nullable: true
        options:
          $ref: '#/components/schemas/FieldOptions'
        is_always_on:
          type: boolean
          example: false
          description: >-
            Defines if the filter is always displayed. If true, the filter is shown at all times;
            if false, it is hidden among the background (advanced) filters. Default value is false.
      required:
        - type

    ResourceActionSchema:
      description:
        Action schema is used for describing action that resource supports.
        Only valid actions for the current resource are returned.
        It means that for detail resource will be returned only detail actions.
      allOf:
        - $ref: '#/components/schemas/GlobalResourceActionSchema'
        - type: object
          properties:
            label:
              type: string
              example: Action label
              description: Action label that is used for rendering action button.
              nullable: true
            icon:
              type: string
              example: action_icon
              description: |
                Action icon that is used for rendering action button.
                You can chose from MUI icons (https://mui.com/material-ui/material-icons).
              nullable: true
            color:
              oneOf:
                - $ref: '#/components/schemas/ColorType'
              description: |
                Action color that is used for rendering action button. 
                If not set, primary color is used.
            confirm_dialog:
              $ref: '#/components/schemas/ConfirmDialogProperties'
            view:
              $ref: '#/components/schemas/ViewActionParameters'
            link:
              $ref: '#/components/schemas/LinkActionParameters'
            resource:
              $ref: '#/components/schemas/ResourceActionParameters'
    ViewSchema:
      description: |
        View schema is used for describing view that resource supports.
        Only valid views for the current resource are returned. 
        It means that for detail resource will be returned only detail views.
      allOf:
        - $ref: '#/components/schemas/GlobalViewSchema'
        - type: object
          properties:
            label:
              type: string
              example: View label
              description: View label.
            list:
              $ref: '#/components/schemas/ListViewParameters'
            detail:
              $ref: '#/components/schemas/DetailViewParameters'
            breadcrumbs:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/MenuSchema'
              description: Breadcrumb trail of the view (chain of menu items leading to it).
    MethodSchema:
      type: object
      description: |
        Method schema is used for describing method that resource supports.
      properties:
        fields:
          type: array
          items:
              $ref: '#/components/schemas/FieldSchema'
          description: List of fields and it's configuration which will be shown in the list view.
        filters:
          type: array
          items:
              $ref: '#/components/schemas/FilterSchema'
          description: List of filters which will be shown in the list view.
      required:
        - fields
        - filters
    AggregateFieldSchema:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Field exposed by the aggregate endpoint. Listed only for fields that are valid
        aggregation targets (non-empty `aggregations`) or valid `group_by` keys
        (non-empty `group_by`). Trimmed to aggregate-relevant properties only – there
        is no `sortable` / `read_only` / `write_only` / `required` here, since they do
        not apply to aggregation.
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: amount
          description: Field name. Matches the value used in `field` / `group_by` query parameters.
        label:
          type: string
          example: Field label
          description: Field label.
          nullable: true
        type:
          $ref: '#/components/schemas/FieldType'
        format:
          allOf:
            - $ref: '#/components/schemas/FieldFormatType'
          description: |
            Format of the field, from the values `FieldSchema.format` uses. Derived from the
            model column, so it carries what the column type tells: `date`, `date-time`,
            `time`, `text` (an unbounded text column) and `uuid`. Absent when the column type
            has no format – a short string, a number, a boolean. A format set on the
            resource's admin field (`email`, `phone`, `rich-text`, …) is not reflected here.
            A client treats an absent `format` as unknown rather than as plain text, and
            ignores a format it does not handle. A `min` / `max` over a `date` / `date-time`
            field returns an ISO 8601 string (see `AggregateBucket.value`).
          example: date-time
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/AggregateFunctionType'
          description: |
            Whitelist of aggregation functions allowed when this field is the target of
            the aggregate endpoint (`function=...&field=...`). Empty / omitted means the
            field cannot be an aggregation target.
          example: [sum, avg, min, max, count]
        group_by:
          type: array
          items:
            type: string
          description: |
            Whitelist of `group_by` forms allowed for this field. Each entry is a bucket
            function name as it appears in the `group_by` query parameter:
              * `exact` – direct value grouping (`group_by=<field>`)
              * `trunc:<gran>` – date / datetime truncation, where `gran` is one of
                `second`, `minute`, `hour`, `day`, `week`, `month`, `quarter`, `year`
              * `width` – numeric fixed-width bucketing (`group_by=<field>:width:<n>`)
            Empty / omitted means the field cannot be used in `group_by`.
          example: [exact, trunc:day, trunc:month]
        enum:
          allOf:
            - $ref: '#/components/schemas/EnumType'
          description: |
            Value/label pairs for a `choices` field. Grouped results return the raw stored
            value, so the frontend uses this mapping to render the display label. Mutually
            exclusive with `reference`.
        reference:
          allOf:
            - $ref: '#/components/schemas/ReferenceType'
          description: |
            Related admin resource name when the field is a relation. Grouped results return
            the raw primary key, so the frontend uses this to resolve the related object.
            Mutually exclusive with `enum`.
        options:
          allOf:
            - $ref: '#/components/schemas/FieldOptions'
          description: |
            Rendering options for the field, exposed the same way as on `FieldSchema`.
            Currently carries `prefix` / `postfix` for decorating the aggregated value
            (e.g. a currency symbol or unit).
    AggregateSchema:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Aggregate endpoint schema. Returned by `/admin/{resource_name}/aggregate/schema`
        on resources where `aggregate_enabled: true` is set in the resource schema.
        Lists the fields available for aggregation (each with its own whitelist of
        aggregation functions and `group_by` forms) and the filters that can be applied.
        Filters reuse the same `ComplexFilterBackend` as the list endpoint.
      required:
        - fields
        - filters
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/AggregateFieldSchema'
          description: Fields exposed by the aggregate endpoint.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterSchema'
          description: Filters that can be applied to the aggregated dataset.
    EndpointsSchema:
      type: object
      description: |
        Endpoints schema describes the endpoints a resource supports, one entry per HTTP method.
        Each entry is a `MethodSchema` describing the fields and filters of that endpoint; a method
        that is absent is not supported.
      properties:
        get:
          $ref: '#/components/schemas/MethodSchema'
        post:
          $ref: '#/components/schemas/MethodSchema'
        patch:
          $ref: '#/components/schemas/MethodSchema'
        put:
          $ref: '#/components/schemas/MethodSchema'
        delete:
          $ref: '#/components/schemas/MethodSchema'
    LocalResourceSchema:
      description: |
        Local resource schema is returned by the per-resource schema routes
        (`/admin/{resource_name}/**/schema`). Unlike `GlobalResourceSchema`, which describes every
        resource of the service in a lightweight, context-free form, this one describes a single
        resource in the context of a concrete request (`_target`, `_source`, `record_pk`).
      allOf:
        - $ref: '#/components/schemas/ObjectResourceSchema'
        - type: object
          properties:
            views:
              type: array
              items:
                $ref: '#/components/schemas/ViewSchema'
              description: List of supported views for the resource. Only views allowed for concreate response (detail, list) are returned.
            endpoints:
              $ref: '#/components/schemas/EndpointsSchema'
      required:
        - name
        - pk_field_name
        - views
        - actions
        - endpoints
    ActionResultMeta:
      type: object
      readOnly: true
      description: |
          Meta information about the action result contains action representation and its schema.
      properties:
        message:
          type: string
          example: Action result message
          description: Action result message
        state:
          $ref: '#/components/schemas/ActionStateType'
        trigger_action:
          $ref: '#/components/schemas/ActionSchema'
    ResourceObjectMeta:
      type: object
      readOnly: true
      description: |
        Meta information about the resource object contains object representation and its schema.
      properties:
        repr:
          type: string
          example: Resource object representation
          description: String representation of the resource object
        schema:
          $ref: '#/components/schemas/ObjectResourceSchema'
        tags:
          type: array
          items:
              type: string
          description: List of tags for the resource object.
          nullable: true
        trigger_action:
          $ref: '#/components/schemas/ActionSchema'
        highlights:
          allOf:
            - $ref: '#/components/schemas/SearchHighlights'
          description: |
              Present only on list endpoint responses when the request carried a non-empty
              ``search`` query and at least one ``search_fields`` path matched on this object.
              Same shape as the service search endpoint's ``highlights``; ``value`` here is the
              full field value (no snippet trimming), ``offsets`` reference positions in the
              original raw value.
      required:
        - repr
        - schema
    ResourceObject:
      type: object
      description: |
        Resource object is used for representing resource object with the meta information.
      properties:
        meta:
          $ref: '#/components/schemas/ResourceObjectMeta'
      additionalProperties:
        oneOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - type: array
          - type: object
    ResourceObjectList:
      type: object
      description: |
        Paginated page of resource objects returned by a list endpoint.
      properties:
        meta:
          $ref: '#/components/schemas/OffsetPaginationMeta'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
    SearchHighlights:
      type: array
      readOnly: true
      x-habarico-tier: enterprise
      description: |
          **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

          Highlights of ``search_fields`` matches for one object, one entry per matched path.
          Fields without a match are omitted. The same shape is used both by the service search
          endpoint (with snippet-radius trimming) and by the list endpoint's ``meta.highlights``
          sidecar (with the full field value). Clients can either render ``value`` directly
          (already contains ``<mark>...</mark>``) or use ``offsets`` to place markers on the raw
          cell value.
      items:
        type: object
        properties:
          name:
            type: string
            example: author__name
            description: |
                Field path exactly as declared in the resource's ``search_fields`` (may traverse
                relations via ``__``).
          value:
            type: string
            example: "<mark>Alpha</mark> article"
            description: |
                HTML-escaped rendition of the resolved field value with each matched substring
                wrapped in ``<mark>...</mark>``. In the search endpoint the value is trimmed to
                a context window around the matches with leading/trailing ``...``. In the list
                endpoint the full field value is returned. Choice fields and booleans use their
                human-readable display (``get_<field>_display()`` and ``gettext("Yes"/"No")``
                respectively). The FE decides per field type whether to render the marks inline
                or just flag the whole cell.
          label:
            type: string
            example: Author name
            description: |
                Human-readable label of the field (from the underlying Django field's
                ``verbose_name``).
          offsets:
            type: array
            description: |
                Half-open ``[start, end]`` spans of each match in the ORIGINAL (raw,
                non-escaped, non-marked) field value returned by the field-path traversal.
                Independent of any snippet trimming applied to ``value``.
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: integer
        required:
          - name
          - value
          - label
          - offsets
    SearchResultObject:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Single hit of a resource search.
      properties:
        id:
          type: string
          example: id
          description: Primary key of the resource object.
        title:
          type: string
          example: Resource object title
          description: Title of the resource object.
        description:
          type: string
          example: Resource object description
          description: Description of the resource object.
        highlights:
          $ref: '#/components/schemas/SearchHighlights'
      required:
        - id
        - title
        - highlights
    SearchResourceObjects:
      type: object
      readOnly: true
      x-habarico-tier: enterprise
      description: |
          **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

          Search resource object is used for representing search result of the resource object.
      properties:
        meta:
          $ref: '#/components/schemas/SearchResourceSchema'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultObject'
      required:
        - meta
        - objects
    ActionResult:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ActionResultMeta'
      additionalProperties:
        oneOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - type: array
          - type: object
    ServiceSchema:
      type: array
      readOnly: true
      description: |
        Returns list of resource schemas for the service.
      items:
        $ref: '#/components/schemas/GlobalResourceSchema'
    UserPreferenceValue:
      description: |
        Stored preference value. The exact JSON shape is defined by the JSON Schema registered
        for the preference key on the backend.

        The `anyOf` below lists the standard preference shapes used by Habarico JS / react-admin
        for well-known keys (locale, theme, dashboard widgets, app layout settings, saved
        queries, datagrid columns and column widths) **and** allows any other JSON value (object,
        array, string, number, boolean) so backends can register custom preferences with arbitrary
        schemas.

        **Standard key → schema mapping** (well-known keys whose value is validated against the
        named schema below; `<resource>` is the resource name, `<preferenceKey>` is a free
        client-chosen identifier):

        | Preference key                              | Schema                       |
        | ------------------------------------------- | ---------------------------- |
        | `locale`                                    | `LocalePreference`           |
        | `theme`                                     | `ThemePreference`            |
        | `preferences.dashboard`                     | `DashboardPreference`        |
        | `preferences.layout.app.pageWidth`          | `AppPageWidthPreference`     |
        | `preferences.layout.app.contrastMode`       | `ContrastModePreference`     |
        | `preferences.layout.app.stripedRows`        | `StripedRowsPreference`      |
        | `preferences.layout.app.density`            | `AppDensityPreference`       |
        | `<preferenceKey>.columns`                   | `ColumnsPreference`          |
        | `<preferenceKey>.columnWidths`              | `ColumnWidthsPreference`     |
        | `<resource>.savedQueries`                   | `SavedQueriesPreference`     |

        Any other key falls back to the generic JSON-value branches and must be registered on
        the backend with its own JSON Schema.
      anyOf:
        - $ref: '#/components/schemas/LocalePreference'
        - $ref: '#/components/schemas/ThemePreference'
        - $ref: '#/components/schemas/DashboardPreference'
        - $ref: '#/components/schemas/AppPageWidthPreference'
        - $ref: '#/components/schemas/ContrastModePreference'
        - $ref: '#/components/schemas/StripedRowsPreference'
        - $ref: '#/components/schemas/AppDensityPreference'
        - $ref: '#/components/schemas/ColumnsPreference'
        - $ref: '#/components/schemas/ColumnWidthsPreference'
        - $ref: '#/components/schemas/SavedQueriesPreference'
        - type: object
          additionalProperties: true
          nullable: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
    UserPreferenceItem:
      type: object
      description: |
        A single user-preference entry. `key` is the registered preference key, `value` is the
        resolved JSON value (validated against the key's JSON Schema), and `updated_at` is the
        ISO 8601 timestamp of the last successful write — or `null` when the key is registered
        but the user has no stored value yet (the response carries the registered default
        instead).
      required:
        - key
        - value
        - updated_at
      properties:
        key:
          type: string
          pattern: '^[a-zA-Z][a-zA-Z0-9_.-]*$'
        value:
          $ref: '#/components/schemas/UserPreferenceValue'
        updated_at:
          type: string
          format: date-time
          nullable: true
    UserPreferenceList:
      type: array
      description: |
        List of user-preference items for the current user. Includes every explicitly registered
        preference key (returning the registered default with `updated_at: null` when the user
        has no stored value yet) plus any stored records whose key matches a registered pattern.
      items:
        $ref: '#/components/schemas/UserPreferenceItem'
    LocalePreference:
      type: string
      description: |
        Locale code stored under the `locale` preference key. Matches the active translation
        bundle on the client (e.g. `cs`, `en`, `de`).
      example: cs
    ThemePreference:
      type: string
      enum:
        - light
        - dark
      description: |
        Theme mode stored under the `theme` preference key.
    AppPageWidthPreference:
      type: string
      enum:
        - full
        - centered
      description: |
        Page width mode stored under the `preferences.layout.app.pageWidth` key. `full` fills
        the viewport; `centered` constrains content to a max width and centers it.
    ContrastModePreference:
      type: boolean
      description: |
        High-contrast mode toggle stored under the `preferences.layout.app.contrastMode` key.
    StripedRowsPreference:
      type: boolean
      description: |
        Datagrid striped-rows toggle stored under the `preferences.layout.app.stripedRows` key.
        Applied globally as a body CSS class so every datagrid picks it up.
    AppDensityPreference:
      type: string
      enum:
        - compact
        - standard
        - comfortable
      description: |
        UI density stored under the `preferences.layout.app.density` key. Controls row height
        and spacing in datagrids and forms.
    SortPreference:
      type: object
      description: |
        Sort descriptor as used by react-admin list params (`{field, order}`).
      required:
        - field
        - order
      properties:
        field:
          type: string
        order:
          type: string
          enum:
            - ASC
            - DESC
    SavedQueryValue:
      type: object
      description: |
        List state captured by a saved query.
      properties:
        filter:
          type: object
          additionalProperties: true
        displayedFilters:
          type: object
          additionalProperties:
            type: boolean
        sort:
          $ref: '#/components/schemas/SortPreference'
        perPage:
          type: integer
          minimum: 1
    SavedQueryPreference:
      type: object
      description: |
        A single saved query as stored by react-admin `FilterButton` under the
        `<resource>.savedQueries` preference key.
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          $ref: '#/components/schemas/SavedQueryValue'
    SavedQueriesPreference:
      type: array
      description: |
        List of saved queries stored under the `<resource>.savedQueries` preference key.
      items:
        $ref: '#/components/schemas/SavedQueryPreference'
    ColumnsPreference:
      type: array
      description: |
        Visible column field names stored by `<DatagridConfigurable>` under the
        `<preferenceKey>.columns` key. Order matches the column display order.
      items:
        type: string
    ColumnWidthsPreference:
      type: object
      description: |
        Per-column pixel widths stored by `<Datagrid>` under the
        `<preferenceKey>.columnWidths` key. Keys are column field sources, values
        are widths in pixels. Missing columns fall back to the column's default width.
      additionalProperties:
        type: number
        minimum: 0
    WidgetType:
      type: string
      description: |
        Dashboard widget kind. Not a closed enum: besides the built-in kinds below, a
        client may register **custom** widget types via its `WidgetProvider`. The backend
        MUST accept any string here and MUST NOT reject unknown widget types. Custom
        widgets manage their own data, so they persist only `id`, `type`, `layout` and an
        optional `label` (no `resource` / aggregate / chart fields).

        Built-in kinds:

        * `table` – renders a `SchemaDatagrid` subset (selected columns, filters, sort).
        * `simple-aggregate` – renders a single computed scalar value over the standard
          list endpoint, without requiring the aggregate endpoint. Supports only `count`
          (the list `total`), `min` and `max` (the `field` value of the first row when
          sorted asc / desc, so `field` must be `sortable` – and a number or a date, see
          `AggregateFunctionType`). Available on any resource
          with a list view.
        * `aggregate` – renders a single computed scalar value via the resource aggregate
          endpoint (`/{api_prefix}/{service_name}/admin/{resource_name}/aggregate`), using
          `field` + `aggregateFunction` (`count` / `sum` / `avg` / `min` / `max`) and no
          `group_by`. Available only on resources with `aggregate_enabled: true`.
        * `bar` / `pie` / `line` – chart widgets backed by the resource aggregate endpoint.
          They group the aggregated value over one or more `groupBy` dimensions and render
          chart-type-specific display via `chartOptions`. Available only on resources with
          `aggregate_enabled: true`.
    TruncBucket:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Date / datetime truncation bucket for a group-by field.
      required: [type, granularity]
      properties:
        type:
          type: string
          enum: [trunc]
        granularity:
          type: string
          enum: [second, minute, hour, day, week, month, quarter, year]
    WidthBucket:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Numeric fixed-width bucket for a group-by field.
      required: [type, size]
      properties:
        type:
          type: string
          enum: [width]
        size:
          type: number
    GroupByBucket:
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Bucketing applied to a group-by field. Omitted → exact-value grouping.
      oneOf:
        - $ref: '#/components/schemas/TruncBucket'
        - $ref: '#/components/schemas/WidthBucket'
      discriminator:
        propertyName: type
        mapping:
          trunc: '#/components/schemas/TruncBucket'
          width: '#/components/schemas/WidthBucket'
    GroupByItem:
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: Field name as used in the aggregate group_by query param.
        bucket:
          $ref: '#/components/schemas/GroupByBucket'
    ChartOptions:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — the dashboard ships in the paid `habarico-enterprise` package. A free-only install stores this payload under `preferences.dashboard` but has no widgets to render it.

        Chart-type-specific display options.
      properties:
        orientation:
          type: string
          enum: [vertical, horizontal]
          description: Bar chart orientation.
        variant:
          type: string
          enum: [pie, doughnut]
          description: Pie chart variant.
    AggregateFunctionType:
      type: string
      enum:
        - count
        - min
        - max
        - sum
        - avg
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Aggregate function used by the aggregate endpoint
        (`/{api_prefix}/{service_name}/admin/{resource_name}/aggregate`) and by the
        `aggregate` dashboard widget.

        * `count` – number of records matching the (filtered) query; `field` is ignored.
        * `min` / `max` – minimum / maximum value of `field`, over numbers and dates. A
          numeric field yields a number, a field with `format` `date` / `date-time` an
          ISO 8601 string (see `AggregateBucket.value`). The widgets offer these functions
          only for such fields: `aggregate` and `simple-aggregate` for a numeric field
          without `enum` / `reference` and for a `date` / `date-time` field, the `bar` /
          `line` / `pie` charts for a numeric field only. The backend does not restrict the
          field type – any field with `min` / `max` in its `aggregations` whitelist is
          accepted – but text, boolean, `time`, reference and enum fields are not a
          supported target and yield the raw stored value. `simple-aggregate` computes
          these on the frontend by sorting the list endpoint, so there `field` must be
          `sortable` rather than `aggregable`. The backend aggregate endpoint requires
          `field` to be `aggregable`.
        * `sum` / `avg` – numeric aggregations computed by the backend aggregate endpoint.
          `field` must be `aggregable` and reference a numeric column.
    WidgetLayout:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — the dashboard ships in the paid `habarico-enterprise` package. A free-only install stores this payload under `preferences.dashboard` but has no widgets to render it.

        Grid placement of a widget on the dashboard. `x`/`y` are the top-left cell, `w`/`h`
        are width/height in grid cells.
      required:
        - x
        - y
        - w
        - h
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        w:
          type: integer
          minimum: 1
        h:
          type: integer
          minimum: 1
        stackedH:
          type: integer
          minimum: 1
          description: |
            Height in grid rows used when the dashboard is too narrow for columns and stacks
            its widgets one below another. Without it the stacked widget keeps `h`.
        minW:
          type: integer
          minimum: 1
          description: Smallest width, in grid columns, the widget can be resized to.
        minH:
          type: integer
          minimum: 1
          description: Smallest height, in grid rows, the widget can be resized to.
    WidgetConfig:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — the dashboard ships in the paid `habarico-enterprise` package. A free-only install stores this payload under `preferences.dashboard` but has no widgets to render it.

        Single dashboard widget definition. Mirrors the `WidgetConfig` type in Habarico JS
        (`src/types.ts`).
      required:
        - id
        - type
        - layout
      properties:
        id:
          type: string
        resource:
          type: string
          description: |
            Resource the widget reads from (`service/resource`). Required for built-in
            data-driven widgets (table / aggregate / chart). Omitted for custom widgets
            that manage their own data source.
        type:
          $ref: '#/components/schemas/WidgetType'
        label:
          type: string
        layout:
          $ref: '#/components/schemas/WidgetLayout'
        filters:
          type: object
          additionalProperties:
            type: string
          description: |
            Filter values applied to the widget's data source, keyed by field name.
            Frontend passes them through to react-admin's `filter` prop.
        sort:
          $ref: '#/components/schemas/SortPreference'
        perPage:
          type: integer
          minimum: 1
        columns:
          type: array
          items:
            type: string
          description: |
            Visible column field names (table widget). Frontend expands each name into a
            `FieldDescriptor` internally.
        field:
          type: string
          description: |
            Measure field for `aggregate` / `bar` / `pie` / `line` widgets. Required for
            `min`, `max`, `sum` and `avg`; ignored for `count`. The field must include the
            chosen function in its `aggregations` whitelist in the aggregate schema
            (the aggregate endpoint enforces this).
        aggregateFunction:
          $ref: '#/components/schemas/AggregateFunctionType'
        groupBy:
          type: array
          items:
            $ref: '#/components/schemas/GroupByItem'
          description: |
            Group-by dimensions for chart widgets (`bar` / `pie` / `line`). The first item
            is the primary axis (x-axis for `bar` / `line`, slices for `pie`); `bar` and
            `line` accept a second item that splits the data into series. Each field /
            bucket combination must be whitelisted in the field's `group_by` aggregate
            schema entry. Omitted / empty for the scalar `aggregate` widget.
        chartOptions:
          $ref: '#/components/schemas/ChartOptions'
        color:
          oneOf:
            - $ref: '#/components/schemas/ColorType'
          description: |
            Color accent applied to the widget (MUI palette key).
    DashboardPreference:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — the dashboard ships in the paid `habarico-enterprise` package. A free-only install stores this payload under `preferences.dashboard` but has no widgets to render it.

        Dashboard layout stored under the `preferences.dashboard` preference key by the
        Habarico JS `useDashboardStore` hook (MR !370). Backend MUST reject configurations
        with overlapping widget layouts.
      required:
        - widgets
      properties:
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetConfig'
    AggregateBucket:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Single row of the aggregate endpoint result. Represents one combination of
        `group_by` keys together with the aggregated value.
      required:
        - value
      properties:
        group:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Map of `group_by` key → bucket label for this row. The key is the field name
            as it appeared in the request (without the bucket function suffix). The value
            is the bucket label – the raw field value for `exact`, an ISO 8601 timestamp
            for `trunc:<gran>` (start of the bucket in the active Django timezone),
            or the numeric lower bound for `width:<n>`.
            `null` (or omitted) when the request did not specify any `group_by`.
          example:
            category__name: Books
            created_at: "2026-01-01T00:00:00+00:00"
            price: 100
        value:
          oneOf:
            - type: number
              nullable: true
            - type: string
          description: |
            Aggregated value. Its type follows the function and the target field:
              * `count` and `sum` always return a number, `avg` a number or `null`.
              * `min` / `max` over a numeric field return a number.
              * `min` / `max` over a field whose `AggregateFieldSchema.format` is `date` or
                `date-time` return an ISO 8601 string – a calendar date for `date`
                (`"2026-01-01"`), a date and time with a UTC offset for `date-time`
                (`"2026-01-01T00:00:00Z"`). Fraction digits and the offset notation
                (`Z`, `.000Z`, `+01:00`) differ between the backends, so a client parses
                the value rather than comparing it as text.
              * `min` / `max` over any other field return the raw stored value – a text, the
                primary key of a reference, the stored code of an enum. Such a field is not a
                supported target (see `AggregateFunctionType`).
            `null` only for `avg` / `min` / `max` when the bucket contains no rows (e.g.
            due to row-level permissions filtering).
          example: 42
    AggregateResult:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Response payload of the aggregate endpoint
        (`GET /{api_prefix}/{service_name}/admin/{resource_name}/aggregate`).
        Returns an array of buckets. When no `group_by` is requested the array contains
        exactly one bucket with the scalar aggregate value.
        The backend enforces a hard limit on the number of buckets (default 50); requests
        producing more buckets are rejected with HTTP 422.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AggregateBucket'
    UploadInitiateRequest:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Body of the initiate request describing the file to be uploaded.
      required:
        - filename
        - size
        - content_type
      properties:
        filename:
          type: string
        size:
          type: integer
          description: File size in bytes.
        content_type:
          type: string
        part_size:
          type: integer
          description: Desired part size in bytes (optional).
    UploadPart:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        A single presigned part returned for a `mode: multipart` initiate.
      properties:
        part_number:
          type: integer
        url:
          type: string
          description: Presigned PUT URL for the part.
    UploadInitiateResult:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Response payload of the initiate endpoint. A discriminated union keyed by `mode`:
        `put` carries `url`; `multipart` carries `upload_id`/`part_size`/`parts`. `key` is
        present in both modes.
      required:
        - mode
        - key
      properties:
        mode:
          type: string
          enum:
            - put
            - multipart
          description: >-
            Discriminator for the upload flow. `put` for a single presigned PUT
            (small files, no `complete` step); `multipart` for an S3 multipart upload.
        key:
          type: string
          description: Temporary object key under tmp_prefix. Present for both modes.
        url:
          type: string
          description: >-
            Present only for `mode: put`. Presigned PUT URL for uploading the whole file
            in one request. The client must send a matching `Content-Type` header.
        upload_id:
          type: string
          description: 'Present only for `mode: multipart`.'
        part_size:
          type: integer
          description: 'Present only for `mode: multipart`.'
        parts:
          type: array
          description: 'Present only for `mode: multipart`. One presigned URL per part.'
          items:
            $ref: '#/components/schemas/UploadPart'
    UploadCompletePart:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        A single uploaded part reported back on complete.
      required:
        - part_number
        - etag
      properties:
        part_number:
          type: integer
        etag:
          type: string
    UploadCompleteRequest:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Body of the complete request finalizing a `mode: multipart` upload.
      required:
        - upload_id
        - key
        - parts
      properties:
        upload_id:
          type: string
        key:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/UploadCompletePart'
    UploadCompleteResult:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Response payload of the complete endpoint.
      properties:
        key:
          type: string
          description: Final temporary key to send as upload_key in POST/PUT.
    UploadAbortRequest:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Body of the abort request cancelling an in-progress multipart upload.
      required:
        - upload_id
        - key
      properties:
        upload_id:
          type: string
        key:
          type: string
  responses:
    BadRequestResponse:
      description: |
        Bad request (HTTP 400). Returned for malformed requests, e.g. invalid JSON body
        or explicitly raised `BadRequest` exceptions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - error: Bad Request
                status: 400
                message: JSON parse error – Expecting value.
                source: null
                timestamp: "2024-01-15T10:30:00.123456+00:00"
    ValidationErrorResponse:
      description: |
        Unprocessable entity (HTTP 422). Returned when request data fails validation.
        This includes form field validation on create/update, invalid filter values,
        and invalid `order_by` query parameter values.
        The `source` field identifies which field caused the error (using `__` for nested fields).

        A client reads `status` and `source`; those are the contract. The `message` is written for
        a person, is translated into the request's language, and its English wording differs
        between the two backends — the examples below show one backend's phrasing, not a string to
        match on.

        For `order_by` the errors of every entry are collected into one response, except a
        malformed entry (the `order_by` source below): that one is answered on its own, before any
        field name is looked at.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          examples:
            field_validation:
              summary: Form field validation error
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: This field is required.
                    source: title
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
                  - error: Unprocessable Entity
                    status: 422
                    message: Ensure this value has at most 100 characters.
                    source: name
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
            nested_field:
              summary: Nested field validation error
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: Enter a valid email address.
                    source: author__email
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
            ordering_unknown_field:
              summary: 'order_by – unknown field name'
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: 'Unknown field name.'
                    source: order_by__unknown_field
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
            ordering_invalid_direction:
              summary: 'order_by – invalid direction (not asc/desc)'
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: 'Unknown direction "up", value must be "asc" or "desc".'
                    source: order_by__title
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
            ordering_invalid_format:
              summary: 'order_by – malformed entry (expected field:direction)'
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: 'Invalid format, expected "field_name:asc" or "field_name:desc".'
                    source: order_by
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
            filter_reverse_field:
              summary: '_reverse_field – invalid value'
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: Invalid value of the filter _reverse_field.
                    source: filter___reverse_field
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
            filter_reverse_filter:
              summary: '_reverse_filter – invalid value'
              value:
                errors:
                  - error: Unprocessable Entity
                    status: 422
                    message: Invalid value of the filter _reverse_filter.
                    source: filter___reverse_filter
                    timestamp: "2024-01-15T10:30:00.123456+00:00"
    NotFoundResponse:
      description: |
        Not found (HTTP 404). Returned when the requested object does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - error: Not Found
                status: 404
                message: Not found.
                source: null
                timestamp: "2024-01-15T10:30:00.123456+00:00"
    MethodNotAllowedResponse:
      description: |
        Method not allowed (HTTP 405). Returned when the admin configuration disables the requested action.
        For example, when `can_create`, `can_update`, or `can_delete` is set to `False` on the admin class.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - error: Method Not Allowed
                status: 405
                message: Method "POST" not allowed.
                source: null
                timestamp: "2024-01-15T10:30:00.123456+00:00"
    ServiceSchemaResponse:
      description: Service schema response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceSchema'
    ServiceSearchResponse:
      x-habarico-tier: enterprise
      description: |
        **Premium** — returned only by the paid `habarico-enterprise` package.

        Service search response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResourceObjects'
    ResourceDetailSchemaResponse:
      description: Resource detail schema response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalResourceSchema'
    ResourceListSchemaResponse:
      description: Resource detail schema response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalResourceSchema'
    ResourceObjectResponse:
      description: Resource object response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceObject'
    ResourceObjectListResponse:
      description: List of resource objects response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceObjectList'
    ResourceActionResponse:
      description: Action response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResult'
    UserPreferenceItemResponse:
      description: Single user-preference item response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPreferenceItem'
    UserPreferenceListResponse:
      description: List of user-preference items for the current user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPreferenceList'
    AggregateResponse:
      x-habarico-tier: enterprise
      description: |
        **Premium** — returned only by the paid `habarico-enterprise` package.

        Aggregate result (HTTP 200). One bucket per combination of `group_by` keys, or a
        single bucket when no `group_by` is requested.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AggregateResult'
          examples:
            scalar:
              summary: Scalar aggregate (no group_by)
              value:
                results:
                  - value: 1234
            group_by_exact:
              summary: Group-by exact value (`group_by=category__name`)
              value:
                results:
                  - group:
                      category__name: Books
                    value: 512
                  - group:
                      category__name: Music
                    value: 89
            group_by_trunc:
              summary: Group-by date truncation (`group_by=created_at:trunc:month`)
              value:
                results:
                  - group:
                      created_at: "2026-01-01T00:00:00+00:00"
                    value: 12
                  - group:
                      created_at: "2026-02-01T00:00:00+00:00"
                    value: 27
                  - group:
                      created_at: "2026-03-01T00:00:00+00:00"
                    value: 31
            group_by_width:
              summary: Group-by numeric width buckets (`group_by=price:width:100`)
              value:
                results:
                  - group:
                      price: 0
                    value: 18
                  - group:
                      price: 100
                    value: 42
                  - group:
                      price: 200
                    value: 7
            group_by_combined:
              summary: Multiple `group_by` keys combined
              value:
                results:
                  - group:
                      category__name: Books
                      created_at: "2026-01-01T00:00:00+00:00"
                    value: 5
                  - group:
                      category__name: Music
                      created_at: "2026-01-01T00:00:00+00:00"
                    value: 3
    AggregateSchemaResponse:
      x-habarico-tier: enterprise
      description: |
        **Premium** — returned only by the paid `habarico-enterprise` package.

        Aggregate endpoint schema response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AggregateSchema'
    UploadInitiateResponse:
      x-habarico-tier: enterprise
      description: |
        **Premium** — returned only by the paid `habarico-enterprise` package.

        Upload initiated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadInitiateResult'
    UploadCompleteResponse:
      x-habarico-tier: enterprise
      description: |
        **Premium** — returned only by the paid `habarico-enterprise` package.

        Upload completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadCompleteResult'
  requestBodies:
    ResourceObjectRequest:
      description: Resource object request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceObject'
    UserPreferenceValueRequest:
      description: |
        New value for the user preference. The body is the raw JSON value (object, array, etc.)
        and is validated against the JSON Schema registered for the key. A schema mismatch yields
        HTTP 422 with the standard error envelope.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPreferenceValue'
    UploadInitiateRequest:
      required: true
      x-habarico-tier: enterprise
      description: |
        **Premium** — accepted only by the paid `habarico-enterprise` package.

        Initiate a chunked upload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadInitiateRequest'
    UploadCompleteRequest:
      required: true
      x-habarico-tier: enterprise
      description: |
        **Premium** — accepted only by the paid `habarico-enterprise` package.

        Complete a chunked upload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadCompleteRequest'
    UploadAbortRequest:
      required: true
      x-habarico-tier: enterprise
      description: |
        **Premium** — accepted only by the paid `habarico-enterprise` package.

        Abort a chunked upload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadAbortRequest'
