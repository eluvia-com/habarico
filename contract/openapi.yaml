openapi: 3.0.3
info:
  title: Habarico
  description: |
    Habarico is framework that simplify development of CMS and ERP system development.
    It adds layer of schemas that describes all resources, views and actions in the system.
    UI is generated from the schemas but still allows customisation.
    The main endpoint is `/admin/schema` which returns base schema for the service resources.
    This schema only contains low-level details about the resources. For higher detail schema 
    use `/admin/{resource_name}/schema` or `/{resource_name}/{record_pk}/schema` endpoints. 
    These endpoints returns schema for the resource list and detail respectively.
    
    For example for resource user `/admin/schema` returns all actions and views that are supported in
    `/admin/user` and `/admin/user/{record_pk}` endpoints. `/admin/user/schema` returns only actions and views 
    that are supported in `/admin/user` endpoint and `/admin/user/{record_pk}/schema` returns only actions and views 
    that are supported in `/admin/user/{record_pk}` endpoint but with higher detail.
  version: 3.5.0
  contact:
    email: lubos.matl@eluvia.com
servers:
  - url: 'http://localhost'
paths:
  /{api_prefix}/{service_name}/admin/schema:
    get:
      summary: Get schema for service.
      description: |
        Get schema for service. This endpoint is the main entry point for the service.
        There are described all resources with actions, views and menus with low-level details.
        Main purpose of this endpoint is to generate UI structure and menu for the service.
        The list of base resource schema is returned. Every base schema contains:
        * `name` - name of the resource
        * `label` - label of the resource
        * `pk_field_name` - name of the primary key field
        * `views` - list of all views that can be used for the resource.
        * `actions` - list of all actions that can be used for the resource.
        * `menu` - description of the menu for the resource.
      operationId: get_schema
      tags:
        - schema
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
      responses:
        '200':
          $ref: '#/components/responses/ServiceSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /{api_prefix}/{service_name}/admin/uploads/initiate:
    post:
      summary: Initiate a chunked upload.
      x-habarico-tier: enterprise
      description: |
        **Premium** — provided by the paid `habarico-enterprise` package; a free-only install does not expose this endpoint.

        Starts a chunked upload of a file. For the `s3-multipart` provider the response shape
        depends on the file size, signalled by the `mode` discriminator:

        * `mode: put` (files below the S3 multipart minimum, 5 MB): a single presigned PUT `url`
          is returned. The browser uploads the whole file in one request; there is no `complete`
          step (the object is fully uploaded by the PUT).
        * `mode: multipart` (larger files): an S3 multipart upload is created and presigned URLs are
          returned per part. The browser uploads the parts directly to storage and then calls
          `complete`. `complete` is only called when `mode == "multipart"`.
      operationId: upload_initiate
      tags:
        - uploads
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - name: target
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque upload target. Omit for the default storage; otherwise a signed token (issued by
            habarico in a field's `initiate_url`) or the name of a target registered through
            `register_upload_target`. A `STORAGES` alias resolves only inside a signed token; sent
            as plaintext it is not accepted and the endpoint answers 404. The token is signed, not
            encrypted - its payload, a storage alias or target name plus the field's upload limits,
            is readable by anyone holding the URL, but cannot be altered or forged. Treat it as
            tamper-proof, never as secret. It never names anything internal: a storage is always
            identified by a name the project itself configured, never by the model field it backs.
      requestBody:
        $ref: '#/components/requestBodies/UploadInitiateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UploadInitiateResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/uploads/complete:
    post:
      x-habarico-tier: enterprise
      description: |
        **Premium** — provided by the paid `habarico-enterprise` package; a free-only install does not expose this endpoint.
      summary: Complete a chunked upload.
      operationId: upload_complete
      tags:
        - uploads
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - name: target
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque upload target. Omit for the default storage; otherwise a signed token (issued by
            habarico in a field's `initiate_url`) or the name of a target registered through
            `register_upload_target`. A `STORAGES` alias resolves only inside a signed token; sent
            as plaintext it is not accepted and the endpoint answers 404. The token is signed, not
            encrypted - its payload, a storage alias or target name plus the field's upload limits,
            is readable by anyone holding the URL, but cannot be altered or forged. Treat it as
            tamper-proof, never as secret. It never names anything internal: a storage is always
            identified by a name the project itself configured, never by the model field it backs.
      requestBody:
        $ref: '#/components/requestBodies/UploadCompleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/UploadCompleteResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/uploads/abort:
    post:
      x-habarico-tier: enterprise
      description: |
        **Premium** — provided by the paid `habarico-enterprise` package; a free-only install does not expose this endpoint.
      summary: Abort a chunked upload.
      operationId: upload_abort
      tags:
        - uploads
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - name: target
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque upload target. Omit for the default storage; otherwise a signed token (issued by
            habarico in a field's `initiate_url`) or the name of a target registered through
            `register_upload_target`. A `STORAGES` alias resolves only inside a signed token; sent
            as plaintext it is not accepted and the endpoint answers 404. The token is signed, not
            encrypted - its payload, a storage alias or target name plus the field's upload limits,
            is readable by anyone holding the URL, but cannot be altered or forged. Treat it as
            tamper-proof, never as secret. It never names anything internal: a storage is always
            identified by a name the project itself configured, never by the model field it backs.
      requestBody:
        $ref: '#/components/requestBodies/UploadAbortRequest'
      responses:
        '204':
          description: Upload aborted.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/search:
    get:
      summary: Get objects of resource by search.
      x-habarico-tier: enterprise
      description: |
        **Premium** — provided by the paid `habarico-enterprise` package; a free-only install does not expose this endpoint.

        Get list of objects of resource by search to allow full text search over all the service resources.
      operationId: get_search
      tags:
        - search
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/search_query'
        - $ref: '#/components/parameters/search_limit'
      responses:
        '200':
          $ref: '#/components/responses/ServiceSearchResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}:
    get:
      summary: Get objects of resource.
      description: |
        Returns list of objects of resource. Every objects contains meta information about the object. 
        The meta contains schema of the objects, especially the actions that can be performed on the object.
        The resource schema (supported methods and fields) is not included in the response 
        (use `schema` endpoint for that, the reason is faster response). Meta contains also `repr` value 
        which is the string representation of the object and `tags` witch can be used 
        to style the object in the UI/Table.
      operationId: get_resource_object_list
      tags:
        - resource
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/order_by'
        - $ref: '#/components/parameters/filter'
      responses:
        '200':
          $ref: '#/components/responses/ResourceObjectListResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    post:
      summary: Create a new object.
      description: |
        Create a new object of the resource. The object is created with the data provided in the request body.
        Newly created object is returned with the meta information about the object.
      operationId: create_resource_object
      tags:
        - resource
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
      requestBody:
        $ref: '#/components/requestBodies/ResourceObjectRequest'
      responses:
        '201':
          $ref: '#/components/responses/ResourceObjectResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/aggregate:
    get:
      summary: Aggregate objects of resource.
      x-habarico-tier: enterprise
      description: |
        **Premium** — provided by the paid `habarico-enterprise` package; a free-only install does not expose this endpoint.

        Computes an aggregation over the resource objects matching the optional filter
        query parameters. Reuses the same `filter_queryset` / `ComplexFilterBackend`
        as the resource list endpoint, so widget filters apply identically.

        **Optional endpoint.** Available only on resources where the admin opts in via
        `ModelAdmin`. Resources without the opt-in return HTTP 404 for this path. The
        availability is signalled in the resource schema via `aggregate_enabled: true`
        (see `GlobalResourceSchema`).

        ## Aggregation target

        * `count` – `field` is ignored.
        * `min` / `max` / `sum` / `avg` – `field` is required and must include the chosen
          function in its `aggregations` whitelist (see `FieldSchema.aggregations`).

        ## Grouping via `group_by`

        `group_by` is a repeat-style query parameter
        (`?group_by=field1&group_by=field2:trunc:month`). Each item has the form
        `<field>[:<bucket_fn>[:<arg>]]`:

        * `<field>` – plain field name. Each field must include `exact` in its
          `FieldSchema.group_by` whitelist.
        * `<field>:trunc:<gran>` – date / datetime truncation. `gran` is one of
          `second`, `minute`, `hour`, `day`, `week`, `month`, `quarter`, `year`.
          Field must include `trunc:<gran>` in its `group_by` whitelist. Bucket labels
          are ISO 8601 timestamps in the active Django timezone (`TIME_ZONE` setting,
          optionally overridden per-request via Django's standard timezone middleware
          / `timezone.activate()`). Implemented on the backend with Django ORM
          `TruncSecond` / `TruncMinute` / `TruncHour` / `TruncDay` / `TruncWeek` /
          `TruncMonth` / `TruncQuarter` / `TruncYear`.
        * `<field>:width:<n>` – numeric fixed-width bucketing into `[0, n)`,
          `[n, 2n)`, … Bucket labels are the lower bounds. Field must include `width`
          in its `group_by` whitelist.

        With no `group_by` the response contains a single bucket with the scalar value.

        ## Limits and safety

        * Whitelist via `aggregations` / `group_by` on `FieldSchema` prevents SQL
          injection and schema leaks. Fields without an entry are rejected with HTTP 422.
        * Hard limit on the number of returned buckets (default 50) – exceeding the
          limit yields HTTP 422.
        * Row-level permissions are inherited from `get_queryset`, so aggregates reflect
          only rows the current user is allowed to see.
      operationId: aggregate_resource_objects
      tags:
        - aggregate
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - name: function
          in: query
          required: true
          description: Aggregate function to apply.
          schema:
            $ref: '#/components/schemas/AggregateFunctionType'
        - name: field
          in: query
          required: false
          description: |
            Field aggregated by `function`. Required for `min` / `max` / `sum` / `avg`;
            ignored for `count`. The chosen `function` must be present in the field's
            `aggregations` whitelist in the resource schema.
          schema:
            type: string
          example: price
        - name: group_by
          in: query
          required: false
          description: |
            One or more `group_by` items in the form
            `<field>[:<bucket_fn>[:<arg>]]`. Repeat the parameter to group by several
            keys (`?group_by=category&group_by=created_at:trunc:month`). Each field /
            bucket function combination must be whitelisted in the field's `group_by`
            schema entry. See the endpoint description for the full syntax.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          examples:
            exact:
              summary: Exact value grouping
              value: [category__name]
            time_trunc:
              summary: Date / datetime truncation
              value: ["created_at:trunc:month"]
            numeric_width:
              summary: Numeric fixed-width bucketing
              value: ["price:width:100"]
            combined:
              summary: Multiple keys combined
              value: [category__name, "created_at:trunc:month"]
      responses:
        '200':
          $ref: '#/components/responses/AggregateResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/export:
    get:
      summary: Export objects of resource.
      description: |
        Returns the resource objects matching the current list filters as a downloadable
        document. It takes the `filter` and `order_by` parameters of the resource list
        endpoint and answers them the same way, so the export contains exactly the rows the
        list shows, in the order it shows them, including the row-level restrictions the
        resource puts on its queryset.

        The response carries a `Content-Disposition: attachment` header with the file name
        (`<resource_name>.<format>`). Clients reading the file name from JavaScript need the
        header exposed via CORS (`Access-Control-Expose-Headers`).

        **Optional endpoint.** The backend switches the export on per resource
        (`export_enabled`); it is off by default. Resources that do
        not export return HTTP 404 for this path. The export button itself is signalled in
        the list view schema through the `list_actions` slot with an action of type
        `export`.

        ## Formats

        The `format` query parameter is resolved by content negotiation against the formats
        the resource offers. `csv` is built in; `xlsx` requires the optional `openpyxl`
        dependency on the backend. Requesting a format the resource does not offer returns
        HTTP 404; omitting the parameter serves the first offered format.

        ## Columns

        Without `fields` the resource exports its whole configured column set. `fields`
        narrows it down and defines the column order; a field the resource does not export
        is rejected with HTTP 422. Column headers are the verbose names of the model fields.

        ## Limits and safety

        * Exports above a fixed row limit (10 000) are rejected with HTTP 422 - building
          them synchronously would block the worker. Answering a bigger export in the
          background instead is **Premium**, provided by the paid `habarico-enterprise`
          package.
        * Reading the resource is required; a resource the user may not read returns
          HTTP 405 for this path.
        * Values a spreadsheet application would evaluate as a formula are escaped by the
          renderers (CSV / XLSX injection).
      operationId: export_resource_objects
      tags:
        - export
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/order_by'
        - $ref: '#/components/parameters/filter'
        - name: format
          in: query
          required: false
          description: |
            Document format. Resolved against the formats the resource offers; the first
            one is used when the parameter is omitted. `csv` and `xlsx` are the formats the
            backend ships with; the set is open, since a backend may register further
            renderers under their own format names.
          schema:
            type: string
          example: csv
        - name: fields
          in: query
          required: false
          description: |
            Comma separated subset of the exported columns, in the order they should appear
            in the document. Defaults to every column the resource exports.
          schema:
            type: string
          example: code,name,price
        - name: ids
          in: query
          required: false
          description: |
            Comma separated primary keys of the explicitly selected rows. Combined with the
            filters; omit it to export everything matching the current filter.
          schema:
            type: string
          example: 1,2,3
      responses:
        '200':
          description: The exported document.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/schema:
    get:
      summary: Get schema for resource.
      description: |
        Returns schema of the resource list. The schema has tree parts:
        * `views` - list of views that can be used for the resource. 
                    But only views for general purpose (without object pk) are returned.
        * `actions` - list of actions that can be used for the resource. 
                      But only actions for general purpose (without object pk) are returned.
        * `endpoints` - map of endpoints that can be used for the resource according to HTTP method.
                        Every endpoint contains schema of fields and filters which can be used for the endpoint.
                        Only endpoints that are supported by the list resource (without pk) are returned.
      operationId: get_resource_schema
      tags:
        - schema
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
      responses:
        '200':
          $ref: '#/components/responses/ResourceListSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/{record_pk}:
    get:
      summary: Get resource object detail.
      description: |
        Returns detail of the object of resource. Oects contains meta information about the object. 
        The meta contains schema of the objects, especially the actions that can be performed on the object.
        The resource schema (supported methods and fields) is not included in the response 
        (use `schema` endpoint for that, the reason is faster response). Meta contains also `repr` value 
        which is the string representation of the object and `tags` witch can be used 
        to style the object in the detail view.
      operationId: get_resource_object_detail
      tags:
        - resource
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/record_pk'
      responses:
        '200':
          $ref: '#/components/responses/ResourceObjectResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    put:
      summary: Update object.
      description: |
        Update object. The object is updated with the data provided in the request body.
        Updated object is returned with the meta information about the object.
      operationId: update_resource_object
      tags:
        - resource
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/record_pk'
      requestBody:
        $ref: '#/components/requestBodies/ResourceObjectRequest'
      responses:
        '200':
          $ref: '#/components/responses/ResourceObjectResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    patch:
      summary: Partial update object.
      description: |
        Partial update object. The object is updated with the data provided in the request body.
        Updated object is returned with the meta information about the object.
      operationId: partial_update_resource_object
      tags:
        - resource
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/record_pk'
      requestBody:
        $ref: '#/components/requestBodies/ResourceObjectRequest'
      responses:
        '200':
          $ref: '#/components/responses/ResourceObjectResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      summary: Delete object.
      description: |
        Delete object. The object is deleted and no content is returned.
        If the object is not found, 404 error is returned.
      operationId: delete_resource_object
      tags:
        - resource
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/record_pk'
      responses:
        '204':
          description: Object deleted
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/{record_pk}/schema:
    get:
      summary: Get schema for object
      description: |
        Returns schema of the resource detail. The schema has tree parts:
        * `views` - list of views that can be used for the resource. 
                    But only views for detail resource (with object pk) are returned.
        * `actions` - list of actions that can be used for the resource. 
                      But only actions for detail resource (with object pk) are returned.
        * `endpoints` - map of endpoints that can be used for the resource according to HTTP method.
                        Every endpoint contains schema of fields and filters which can be used for the endpoint.
                        Only endpoints that are supported by the detail resource (with pk) are returned.
      operationId: get_resource_object_schema
      tags:
        - schema
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/record_pk'
      responses:
        '200':
          $ref: '#/components/responses/ResourceDetailSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/{action_name}/schema:
    get:
      summary: Get schema for resource action.
      description: |
        Returns schema of the resource list. The schema has tree parts:
        * `views` - list of views that can be used for the resource. 
                    But only views for general purpose (without object pk) are returned.
        * `actions` - list of actions that can be used for the resource. 
                      But only actions for general purpose (without object pk) are returned.
        * `endpoints` - map of endpoints that can be used for the resource according to HTTP method.
                        Every endpoint contains schema of fields and filters which can be used for the endpoint.
                        Only endpoints that are supported by the list resource (without pk) are returned.
      operationId: get_resource_action_schema
      tags:
        - schema
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/action_name'
      responses:
        '200':
          $ref: '#/components/responses/ResourceListSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/{record_pk}/{action_name}/schema:
    get:
      summary: Get schema for object action
      description: |
        Returns schema of the resource detail. The schema has tree parts:
        * `views` - list of views that can be used for the resource. 
                    But only views for detail resource (with object pk) are returned.
        * `actions` - list of actions that can be used for the resource. 
                      But only actions for detail resource (with object pk) are returned.
        * `endpoints` - map of endpoints that can be used for the resource according to HTTP method.
                        Every endpoint contains schema of fields and filters which can be used for the endpoint.
                        Only endpoints that are supported by the detail resource (with pk) are returned.
      operationId: get_resource_object_action_schema
      tags:
        - schema
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/resource_name'
        - $ref: '#/components/parameters/record_pk'
        - $ref: '#/components/parameters/action_name'
      responses:
        '200':
          $ref: '#/components/responses/ResourceDetailSchemaResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /{api_prefix}/{service_name}/admin/{resource_name}/aggregate/schema:
    get:
      summary: Get schema for the aggregate endpoint of resource.
      x-habarico-tier: enterprise
      description: |
        **Premium** — provided by the paid `habarico-enterprise` package; a free-only install does not expose this endpoint.

