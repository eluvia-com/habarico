  /{api_prefix}/{service_name}/admin/user-preferences:
    description: |
      **Optional feature.** The whole `user-preferences` endpoint group is not required for a
      Habarico service to be considered compliant. Backends that do not register any preferences
      (or that disable the feature entirely) may omit these endpoints; clients must therefore
      tolerate `404` responses on the entire group and fall back to local defaults.

      User preferences provide a per-user key-value store on the backend, used by the admin UI to
      persist context across devices and sessions (e.g. dashboard widgets, list filters, view mode,
      column selection). Each key must be registered on the backend via `register_preference`
      together with its JSON Schema; only registered keys can be read or written.
    get:
      summary: List user preferences for the current user.
      description: |
        Returns every registered preference for the authenticated user. Items with a stored value
        carry it together with the `updated_at` timestamp of the last write; registered keys with
        no stored value yet are returned with the registered default and `updated_at: null`.
        Pattern-only registrations with no stored value are omitted.
      operationId: list_user_preferences
      tags:
        - user preferences (optional)
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
      responses:
        '200':
          $ref: '#/components/responses/UserPreferenceListResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    delete:
      summary: Delete all user preferences for the current user.
      description: |
        Removes every stored preference value for the authenticated user. Registered keys
        themselves are not affected — subsequent `GET` requests will return registered defaults.
        Always returns 204, even if the user had no stored values.
      operationId: delete_all_user_preferences
      tags:
        - user preferences (optional)
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
      responses:
        '204':
          description: All preference values for the user deleted (or none were stored).
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /{api_prefix}/{service_name}/admin/user-preferences/{key}:
    description: |
      Single user-preference resource identified by `key`. The key must be registered on the
      backend; otherwise both `GET` and `PUT` return 404. JSON Schema validation is enforced on
      `PUT`. On `GET`, a stored value that no longer matches the current schema is deleted and the
      registered default is returned in its place; there is no migration hook.

      **Standard key → schema mapping** (well-known keys whose value is validated against the
      named schema; `<resource>` / `<preferenceKey>` are placeholders):

      | Preference key                              | Schema                       |
      | ------------------------------------------- | ---------------------------- |
      | `locale`                                    | `LocalePreference`           |
      | `theme`                                     | `ThemePreference`            |
      | `preferences.dashboard`                     | `DashboardPreference`        |
      | `preferences.layout.app.pageWidth`          | `AppPageWidthPreference`     |
      | `preferences.layout.app.contrastMode`       | `ContrastModePreference`     |
      | `preferences.layout.app.stripedRows`        | `StripedRowsPreference`      |
      | `preferences.layout.app.density`            | `AppDensityPreference`       |
      | `<preferenceKey>.columns`                   | `ColumnsPreference`          |
      | `<preferenceKey>.columnWidths`              | `ColumnWidthsPreference`     |
      | `<resource>.savedQueries`                   | `SavedQueriesPreference`     |

      Any other key falls back to a backend-defined JSON Schema registered via
      `register_preference`.
    get:
      summary: Get a single user preference value.
      description: |
        Returns the stored preference value for the authenticated user.
        If the key is registered but the user has no stored value, returns the default
        registered for the key. If the stored value fails validation against the current schema
        it is deleted and the registered default is returned instead, or `404` when the key has
        no default.
      operationId: get_user_preference
      tags:
        - user preferences (optional)
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/user_preference_key'
      responses:
        '200':
          $ref: '#/components/responses/UserPreferenceItemResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
    put:
      summary: Set a user preference value.
      description: |
        Validates the request body against the JSON Schema registered for `key` and persists it
        for the authenticated user. Returns the stored item including its `updated_at` timestamp.
      operationId: put_user_preference
      tags:
        - user preferences (optional)
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/user_preference_key'
      requestBody:
        $ref: '#/components/requestBodies/UserPreferenceValueRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserPreferenceItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    delete:
      summary: Delete a user preference value.
      description: |
        Removes the stored preference value for the authenticated user. The key itself remains
        registered on the backend, so subsequent `GET` requests will return the registered
        default. Returns 404 if the key is not registered. Deleting a key that has no stored
        value is a no-op and still returns 204.
      operationId: delete_user_preference
      tags:
        - user preferences (optional)
      parameters:
        - $ref: '#/components/parameters/api_prefix'
        - $ref: '#/components/parameters/service_name'
        - $ref: '#/components/parameters/user_preference_key'
      responses:
        '204':
          description: Preference value deleted (or no value was stored).
        '404':
          $ref: '#/components/responses/NotFoundResponse'
components:
  parameters:
    api_prefix:
      name: api_prefix
      in: path
      required: true
      schema:
        type: string
    service_name:
      name: service_name
      in: path
      required: true
      schema:
        type: string
    search_query:
      x-habarico-tier: enterprise
      description: |
        **Premium** — accepted only when the paid `habarico-enterprise` package is installed.
      name: search
      in: query
      required: true
      schema:
        type: string
        description: |
          Search query for the service. It is used for full text search over all the service resources.

          The search matches against fields declared in each resource's ``search_fields``. Text
          fields (``CharField``, ``TextField`` and subclasses), choice fields, ``BooleanField``
          and numeric fields are supported and produce aligned highlights. Date/time and
          ``UUIDField`` are not recommended in ``search_fields`` - the DB query matches the ISO
          form but the FE typically renders the value differently, so the returned highlight
          offsets won't line up with what the user sees. For dates, use a range filter instead.
    search_limit:
      x-habarico-tier: enterprise
      description: |
        **Premium** - accepted only when the paid `habarico-enterprise` package is installed.
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 5
        description: |
          Results contributed by *each* resource, not by the response as a whole - a request fans
          out over every resource with ``global_fulltext_search_enabled``, so the response may hold
          up to ``limit`` objects per resource.

          A value outside this range - non-numeric, zero, negative, or above the maximum - is
          refused with ``422``. Omitting the parameter (or sending it empty) applies the default.
          Both the default and the maximum are configurable per project (``HABARICO_SEARCH`` in
          Python, ``HabaricoEnterprise::Search::Config`` in Ruby), so a deployment may accept more
          than the documented maximum - or less.
    order_by:
      name: order_by
      in: query
      required: false
      schema:
        type: string
        example: 'placed_at:desc,number:asc'
        description: |
          Ordering of the list: `field:direction` entries separated by `,`, applied left to right.
          `direction` is `asc` or `desc`, lower-case. Whitespace around an entry is ignored, and a
          missing or empty parameter leaves the resource's own default ordering in place.

          Anything else is refused with `422`: a missing or repeated `:`, an empty field name, and
          a direction in any other spelling (`ASC`, `ascending`, `up`).

          `field` is a value the resource schema advertises as `sort_by` — which is not always the
          field's own name. A range field sorts by its lower bound, a column reached over an
          association is addressed as `association__column`, and a field may name a different
          column to sort by. Anything the schema does not advertise is refused with `422`, on
          `order_by__<field>`. A resource that forces its ordering ignores the parameter instead.

          In a service serving camel-case names the parameter is `orderBy`; the field names inside
          it are unaffected.
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
        example: 'status="published"&category__in=[3, 7]'
        description: |
          Filtering of the list: `field=<JSON value>` terms joined by `&`, the whole of it being
          the single value of this one parameter and percent-encoded as such. A term's value is
          JSON, so a string is quoted (`status="published"`), and a number, a boolean and an array
          are written as themselves (`category__in=[3, 7]`). A missing or empty parameter filters
          nothing away.

          `field` is a filter the resource schema advertises - the `name` of a `FilterSchema`,
          lookup suffix included where the filter has one (`__in`, `__gte`, `__icontains`). A field
          the resource does not offer for filtering is refused with `422`, and the unknown fields of
          one request are answered together; a term that is not `field=<JSON value>` is answered on
          its own, before any field name is looked at.

          A `search=` term carries a fulltext query rather than a field filter - it is how the
          frontend sends the list's search box. Which resources answer it is a backend matter: in
          the Python backend the fulltext search is **Premium**.

          A filter may also be sent as a query parameter of its own (`?status=published`), which
          both backends accept. `filter` is the form the frontend sends and the only one validated
          as a whole, so it is the one to write a client against.
    resource_name:
      name: resource_name
      in: path
      required: true
      schema:
        type: string
    record_pk:
      name: record_pk
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/KeyType'
    action_name:
      name: action_name
      in: path
      required: true
      schema:
        type: string
    user_preference_key:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z][a-zA-Z0-9_.-]*$'
        description: |
          Preference key registered on the backend via `register_preference`. Must match
          `^[a-zA-Z][a-zA-Z0-9_.-]*$` (ASCII letters, digits, underscore, dot and hyphen;
          must start with a letter). Habarico JS uses camelCase segments (e.g.
          `preferences.layout.app.pageWidth`) and may embed UUIDs with hyphens in per-widget
          keys (e.g. `preferences.widget.<uuid>.datagrid.columnWidths`).
  schemas:
    # Custom types
    FieldType:
      type: string
      enum:
        - string
        - number
        - integer
        - boolean
        - array
        - object
      description: |
        Type of the field, these types are the same as JSON types 
        (https://swagger.io/docs/specification/v3_0/data-models/data-types/).
    FieldFormatType:
      type: string
      enum:
        - date
        - date-time
        - time
        - text
        - rich-text
        - email
        - url
        - password
        - base64-image
        - base64-file
        - uuid
        - relation
        - tree-relation
        - choices
        - search
        - decimal
        - phone
        - czech-bank-account
        - czech-ico
        - czech-dic
        - czech-birth-number
        - czech-id-card-number
        - ai
        - ai-text
        - range
      description: |
        Format of the field. Format specifies how the field will be displayed in the view.
        Value is not required, if not set default format will be used. Currently supported formats are:
        * `date` - date format (ISO 8601).
        * `date-time` - date and time format (ISO 8601).
        * `time` - time format (ISO 8601).
        * `text` - text format, used for multiline texts.
        * `rich-text` - rich text format with wysiwyg editor.
        * `email` - email format (RFC 5322).
        * `url` - URL format (RFC 3986).
        * `password` - password format. Password value is hidden.
        * `base64-image` - base64 image format. It is used for object type fields with subfields 
                           (content, filename, url, format, size).
        * `base64-file` - base64 file format. It is used for object type fields with subfields 
                          (content, filename, url, format, size).
        * `uuid` - text with UUID format.
        * `relation` - relation format, rendered as a selectbox with search.
        * `tree-relation` - relation format for a self-referencing (hierarchical) resource, rendered
                            as a tree selector. The parent field is named by
                            `RelationFieldOptions.parent`.
        * `choices` - choices format with predefined choices.
        * `search` - search format used for filter.
        * `decimal` - decimal number format, rendered with a fixed fraction-digit range instead of the
                      plain number rendering.
        * `phone` - phone format.
        * `czech-bank-account` - Czech bank account format.
        * `czech-ico` - Czech ICO format.
        * `czech-dic` - Czech DIC format.
        * `czech-birth-number` - Czech birth number format.
        * `czech-id-card-number` - Czech ID card number format.
        * `ai` - AI format used for auto complete.
        * `ai-text` - AI text format for auto complete.
        * `range` - range format for number, date, string and other ranges.
      nullable: true
    ColorType:
      type: string
      enum:
        - primary
        - secondary
        - success
        - error
        - warning
        - info
        - inherit
      description: |
        Color of the action button. Color specifies the color of the action button.
        Value is not required, if not set default color will be used. Currently supported colors are:
        * `primary` - primary color.
        * `secondary` - secondary color.
        * `success` - success color.
        * `error` - error color.
        * `warning` - warning color.
        * `info` - info color.
        * `inherit` - inherit color.
      nullable: true
    BoxType:
      type: string
      enum:
        - tab
        - tab-item
        - wizard
        - simple
        - list
        - object
        - array
        - grid
        - grid-item
        - gallery
      description: |
        Box type, defines type of the box. Box is used for grouping fields.
        Currently supported box types are:
        * `tab` - tab box.
        * `tab-item` - item box inside tab or wizard.
        * `wizard` - wizard box.
        * `simple` - simple box with fields and or sub-boxes.
        * `list` - list box.
        * `object` - object box for complex object field.
        * `array` - array box for array object field.
        * `grid` - grid box.
        * `grid-item` - grid item box.
        * `gallery` - gallery box for displaying images as a carousel.
    ActionStateType:
      type: string
      enum:
        - running
        - success
        - error
      description: |
        State of the action. Currently supported states are:
        * `running` - action is running.
        * `success` - action was successful.
        * `error` - action failed.
    RequestMethodType:
      type: string
      enum:
        - get
        - post
        - put
        - patch
        - delete
      example: get
      description: supported HTTP methods.
    TextAlignType:
      type: string
      enum:
        - left
        - center
        - right
      example: left
      description: Text alignment for the field.
    DialogWidthType:
      type: string
      nullable: true
      description: |
        Width of the dialog. Only used when mode is `dialog`.
        Accepts MUI breakpoints (`xs`, `sm`, `md`, `lg`, `xl`) or a pixel value string (e.g. `800px`).
      example: lg
    SortDirectionType:
      type: string
      enum:
        - asc
        - desc
      example: asc
      description: |
        Sort direction:
        * `asc` - ascending order.
        * `desc` - descending order.
    ViewType:
      type: string
      enum:
        - create
        - list
        - show
        - edit
        - action
      example: create
      description: |
        View type, currently supported are create, list, show and edit:
        * `create` - create new object
        * `list` - list of objects
        * `show` - object detail
        * `edit` - edit object
        * `action` - action view, used sending data to the REST action

        The names `list`, `create`, `edit` and `show` are **reserved**: both backend and frontend map them
        to fixed, short browser (SPA) routes, recognised by this `type`. Any other view is addressed by its
        `action_name` (see `ViewEndpointParameters`). The browser route is derived by the frontend as follows
        (it is **not** the REST `endpoint`):
        * `list` -> `/{resource}`
        * `create` -> `/{resource}/create`
        * `edit` -> `/{resource}/{id}`
        * `show` -> `/{resource}/{id}/show`
        * non-reserved, list-level -> `/{resource}/a/{action_name}`
        * non-reserved, detail -> `/{resource}/{id}/a/{action_name}`

        The presentation `mode` (`redirect`/`modal`/`sidepanel`) does not change the route, only how the view
        is shown.
    ViewModeType:
      type: string
      enum:
        - redirect
        - dialog
        - sidepanel
      example: redirect
      description: |
        Presentation mode of the view. Mode defines how the view will be opened:
        * `redirect` - navigate to the view's own browser route
        * `dialog` - open the view in a modal dialog
        * `sidepanel` - open the view in a docked side panel

        The mode never changes the browser route (see `ViewType`), only the way the view is rendered.

        What an omitted mode falls back to depends on where it is used:
        * on a trigger (`ViewActionParameters.mode`, `ViewActionDescriptorParameters.mode`) - the
          trigger inherits the target view's own `mode`, and only then falls back to `redirect`
        * on a view (`GlobalViewSchema.mode`) - this is that own `mode`, used when a trigger opens
          the view without specifying one; when omitted the frontend falls back to `redirect`
        * on a relation field (`RelationFieldOptions.link_mode`) - how the linked record's view is
          opened
      nullable: true
    ActionType:
      type: string
      enum:
        - view
        - link
        - resource
        - save
        - ai-assistant
        - upload-files
        - export
      example: view
      description: |
        Action type, currently supported are view, link and resource:
        * `view` - redirect to view
        * `link` - link to external URL
        * `resource` - call resource action
        * `save` - save the object
        * `ai-assistant` - open the AI assistant for the record. Like `resource`, it is configured by
          `ResourceActionParameters` and requires its `endpoint`.
        * `upload-files` - bulk-upload files, one record per file
        * `export` - export list data to a file
    AfterSaveType:
      type: string
      enum:
        - stay
        - prev
        - show
        - list
      example: prev
      description: |
        Behaviour after a successful save:
        * `stay` - stay on the current form (do not navigate away)
        * `prev` - navigate back (browser history back / close dialog)
        * `show` - open the show view for the saved record
        * `list` - navigate to the list view of the resource
    MenuType:
      type: string
      enum:
        - view
        - link
        - text
      example: view
      description: |
        Menu type, defines if menu item is link to view or external URL:
        * `view` - resource view (list, create, show, edit) will be opened
        * `link` - external URL will be opened
        * `text` - simple text item, not clickable
    KeyType:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: |
        Key type, defines type of the key field. Key field is used for object identification.
        Identifiers are always UUIDs (RFC 4122) — numeric identifiers are not supported.
    FilterValues:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: integer
          - type: boolean
      example:
        is_active: true
      description: |
        Filter values keyed by field name.

        What they apply to depends on where they are used:
        * `extra_filters` - filters applied to the listed items on top of the user's own filters
        * `sort_for_filters` - sorting is offered only while the list is filtered by exactly these
          values
    KeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      description: |
        Key value type defines key value pair. It is used for choices or filters defined on the server side.
    TargetType:
      type: string
      description: |
        Target type, defines type of the target field.
        Target field is used for filtering list according to the source object.

        Not to be confused with `LinkTargetType`, which says where a link opens.
      example: permissions
    LinkTargetType:
      type: string
      enum:
        - self
        - blank
      example: blank
      description: |
        Where a link opens. The value is stored without the leading underscore; clients prepend it
        when rendering, so `blank` becomes the HTML `target="_blank"`.
        * `self` - open in the current tab
        * `blank` - open in a new tab
    ReferenceType:
      type: string
      description: |
        Reference type, defines name of the related resource. For resource from the same service, 
        only resource name is required. If resource is from another service, 
        reference is in format `service_name/resource_name`.
      example: auth/user
    DetailType:
      type: boolean
      example: false
      description: |
        Defines if view or action is generated for object detail (URL has pk) or general (URL has no pk, list of objects)
    EnumType:
      type: array
      items:
        type: object
        properties:
          value:
            $ref: '#/components/schemas/KeyType'
          label:
            type: string
            example: Enum label
          color:
            $ref: '#/components/schemas/ColorType'
          icon:
            type: string
            example: FiberNew
            description: >
              Optional MUI icon name for this enum value, overrides default action icon.
      nullable: true

    ValidatorRule:
      type: object
      description: |
        A single validation rule enforced by the frontend before submit. `type` selects which
        constraint this rule represents; `value` holds the constraint value (its JSON type
        depends on `type` — e.g. an integer for `max_length`/`min_length`, a number for
        `max_value`/`min_value`, a JavaScript-compatible regex string for `regex`). The optional
        `message` is shown when the rule is violated; when omitted the frontend falls back to a
        generic default message.
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: The kind of constraint this rule enforces.
          enum:
            - max_length
            - min_length
            - max_value
            - min_value
            - regex
        value:
          oneOf:
            - type: integer
            - type: number
            - type: string
          example: 100
          description: |
            The constraint value the input is checked against. An integer for `max_length`/
            `min_length`, a number for `max_value`/`min_value`, or a regular expression string
            (JavaScript-compatible) for `regex`.
        message:
          type: string
          example: "Enter no more than 100 characters."
          description: Error message shown when the rule is violated.

    # Base response schemas
    Error:
      type: object
      readOnly: true
      description: |
        Single error object. All API errors are returned in this format wrapped in the `errors` array.
        The `source` field uses `__` as separator for nested fields (e.g. `address__city`).
        In DEBUG mode an additional `traceback` field may be present.
      required:
        - error
        - status
        - message
        - timestamp
      properties:
        message:
          type: string
          example: This field is required.
          description: Human-readable error description.
        status:
          type: integer
          example: 422
          description: HTTP status code repeated from the response.
        source:
          type: string
          nullable: true
          example: field_name__sub_field_name
          description: |
            Path to the field that caused the error, using `__` as separator for nested fields.
            `null` for non-field errors (e.g. general validation errors).
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.123456+00:00"
          description: ISO 8601 timestamp with timezone when the error was handled.
        error:
          type: string
          example: Unprocessable Entity
          description: HTTP status text corresponding to the status code.
        traceback:
          type: string
          description: Python traceback. Only present when the server runs in DEBUG mode.
    Errors:
      type: object
      readOnly: true
      description: |
        Standard error envelope returned by all error responses.
        Every error response, regardless of HTTP status code, uses this structure.
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    OffsetPaginationMeta:
      type: object
      readOnly: true
      properties:
        limit:
          type: integer
          format: int64
          example: 20
        offset:
          type: integer
          format: int64
        cursor:
          oneOf:
            - type: integer
              format: int64
            - type: string
          example: 20
          description: |
            Opaque pagination cursor. Treat it as a token to pass back verbatim, not as a number -
            a backend may return it either as an integer offset or as an encoded string.
        total_count:
          type: integer
          format: int64
          example: 1

    # Parameters
    ActionViewChoice:
      type: object
      description: |
        Single choice of a view action. Selecting it opens the target view with the choice's own
        parameters.
      properties:
        label:
          type: string
          example: Menu choice label
          description: Label of the menu item.
        parameters:
          type: object
          description: |
            Object with view parameters which will be sent to the view.
          additionalProperties: true
    ViewActionDescriptorParameters:
      type: object
      nullable: true
      properties:
        mode:
          $ref: '#/components/schemas/ViewModeType'
        dialog_width:
          $ref: '#/components/schemas/DialogWidthType'
        parameters:
          type: object
          description: |
            Object with view parameters which will be sent to the view.
          additionalProperties: true
        keep_linked_parent:
          type: boolean
          nullable: true
          description: |
            Should the view keep the parent object in the URL path when navigating to the linked resource.
        choices:
          type: array
          description: |
            List of choices which will be shown in the menu.
            All menu data will be added to the query string.
          items:
            $ref: '#/components/schemas/ActionViewChoice'
    ViewActionParameters:
      type: object
      nullable: true
      example:
        name: list
      description:
        View parameters, required if menu type is `view`.
      properties:
        name:
          type: string
          example: view_name
          description: Name of the view which will be opened.
        endpoint:
          $ref: '#/components/schemas/ViewActionEndpointParameters'
        choices:
          type: array
          description: |
            List of choices which will be shown in the menu. 
            All menu data will be added to the query string.
          items:
            $ref: '#/components/schemas/ActionViewChoice'
        parameters:
          type: object
          description: |
            Object with view parameters which will be sent to the view.
          additionalProperties: true
        mode:
          $ref: '#/components/schemas/ViewModeType'
        dialog_width:
          $ref: '#/components/schemas/DialogWidthType'
        keep_linked_parent:
          type: boolean
          nullable: true
          description: |
            Should the view keep the parent object in the URL path when navigating to the linked resource.
      required:
        - name
    LinkActionParameters:
      type: object
      nullable: true
      description:
        Link parameters, required if menu type is `link`.
      properties:
        url:
          type: string
          format: uri
          example: https://example.com
          description: |
            URL which will be opened. May be templated with record values (`%{data.website}`),
            which is why clients restrict what they honour: only `http:`, `https:` and relative
            URLs are opened, and always with `noopener,noreferrer`. Any other scheme —
            `javascript:`, `data:`, `blob:`, but also `mailto:` and `tel:` — is refused, so a
            value saved by a user cannot become code running in an admin's session.
        target:
          $ref: '#/components/schemas/LinkTargetType'
      required:
        - url
    ViewActionEndpointParameters:
      type: object
      description: |
        Endpoint parameters. Endpoint is used for calling resource action.
      properties:
        reference:
          oneOf:
            - $ref: '#/components/schemas/ReferenceType'
          description: Reference to another service resource. Required if view is from another service or resource.
        action_name:
          type: string
          example: action_name
          description: Name of the resource action which will be called. Value is required only if action is not standard.
        record_pk:
          oneOf:
            - $ref: '#/components/schemas/KeyType'
          description: Value of the object primary key. Required if action is for specific object.
    ResourceActionEndpointParameters:
      type: object
      description: |
        Endpoint parameters. Endpoint is used for calling resource action.
      properties:
        path:
          type: string
          example: resource_name
          description: |
            Name of the resource which will be called. Value is required only if standard resource path is not used.
        method:
          $ref: '#/components/schemas/RequestMethodType'
        reference:
          oneOf:
            - $ref: '#/components/schemas/ReferenceType'
          description: Reference to another service resource. Required if view is from another service or resource.
        action_name:
          type: string
          example: action_name
          description: Name of the resource action which will be called. Value is required only if action is not standard.
        record_pk:
          oneOf:
            - $ref: '#/components/schemas/KeyType'
          description: Value of the object primary key. Required if action is for specific object.
      required:
        - method
    ViewEndpointParameters:
      type: object
      description: |
        Endpoint parameters. Endpoint is used for calling resource action.

        This is the **REST API** endpoint (the data source, e.g. `GET /admin/article/1/`), not the browser
        (SPA) route. The browser route is derived by the frontend from the view `type`, `is_detail` and
        `action_name` - see `ViewType` for the convention.
      properties:
        path:
          type: string
          example: resource_name
          description: |
            Name of the resource which will be called. Value is required only if standard resource path is not used.
        method:
          $ref: '#/components/schemas/RequestMethodType'
        reference:
          oneOf:
            - $ref: '#/components/schemas/ReferenceType'
          description: Reference to another service resource. Required if view is from another service or resource.
        action_name:
          type: string
          example: action_name
          description: Name of the resource action which will be called. Value is required only if action is not standard.
      required:
        - method
    ConfirmDialogProperties:
      type: object
      description: |
        Confirm dialog parameters, dialog is shown before action is executed.
      properties:
        title:
          type: string
          example: Confirm title
          description: Confirm dialog title.
        message:
          type: string
          example: Confirm message
          description: Confirm dialog message.
      nullable: true
      required:
        - title
        - message
    ResourceActionParameters:
      type: object
      nullable: true
      description: |
        View parameters, required if type is `view`.
      properties:
        endpoint:
          $ref: '#/components/schemas/ResourceActionEndpointParameters'
        data:
          type: object
          description: Data which will be sent to the resource action.
        is_background:
          type: boolean
          example: false
          description: Defines if action is background.
      required:
        - is_background
    SaveActionParameters:
      type: object
      nullable: true
      description: |
        Save action parameters, required if action type is `save`.
      properties:
        data:
          type: object
          description: Data that will be added to the object on save.
        after_save:
          $ref: '#/components/schemas/AfterSaveType'
    UploadFilesActionParameters:
      type: object
      nullable: true
      description: |
        Upload files action parameters, present when action type is `upload-files` and at least
        one parameter is set. Omitted entirely when no parameter is provided.
      properties:
        reference:
          type: string
          example: attachments
          description: |
            Resource where a record is created for each uploaded file. When set, files are uploaded
            to this resource instead of the current resource context.
        target:
          type: string
          example: article
          description: |
            Field name on the file model linking to the parent record. When set together with
            `reference`, the current record's ID is used as the target value.
        accept:
          type: array
          items:
            type: string
          example:
            - .png
            - .jpg
          description: |
            List of accepted file types. When not set, the frontend uses its own
            default (`.png,.jpg,.jpeg,.bmp,.gif`), which accepts images only — set it whenever
            the action uploads other files.
        data:
          type: object
          description: Additional data that will be added to each uploaded file record.
        file_field:
          type: string
          example: file
          description: |
            Field name on the file model that holds the uploaded file. There is no default: an
            action without it saves nothing.
    ExportActionParameters:
      type: object
      nullable: true
      description: |
        Export action parameters, present when action type is `export` and at least one parameter
        is set. Omitted entirely when no parameter is provided.
      properties:
        format:
          type: string
          example: csv
          description: |
            Export format (e.g. `csv`, `xlsx`). When not set, the backend default format is used.
        fields:
          type: array
          items:
            type: string
          example:
            - title
            - status
          description: |
            List of field names to export. When not set, the backend exports its default
            set of fields.
    SortableParameters:
      type: object
      description: |
        Drag & drop sorting configuration of a list. If set, rows of the list can be reordered.
      nullable: true
      properties:
        field_name:
          type: string
          example: field_name
          description: Field name used for sorting.
        sort_for_filters:
          $ref: '#/components/schemas/FilterValues'
    ListBoxParameters:
      type: object
      description: |
        List box parameters. List box is used for displaying objects in the table.
      properties:
        reference:
          type: string
          example: auth/user
          description: Reference to another service resource.
        target:
          $ref: '#/components/schemas/TargetType'
        row_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered as inline buttons on each table row (e.g. edit, delete).
            Null means all supported object actions are shown.
          nullable: true
        toolbar_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered in the table's own toolbar (top of the resource list, e.g. create),
            separate from the box-level toolbar which belongs to the box root. Absent when not configured.
          nullable: true
        list_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Utility actions rendered next to the filter bar, separate from row and toolbar actions
            (e.g. export, print). Absent when not configured.
          nullable: true
        default_sorting:
          oneOf:
            - $ref: '#/components/schemas/SortDescriptor'
          description: Default ordering of the list.
        extra_filters:
          $ref: '#/components/schemas/FilterValues'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterDescriptor'
          description: List of filters which will be shown in the list view.
        sortable:
          oneOf:
            - $ref: '#/components/schemas/SortableParameters'
          description: |
            List box can be drag & drop sortable. If sortable is set, list will be sortable.
        schema_params:
          type: object
          description: |
            Parameters that will be send to get schema request.
        double_click_action:
          allOf:
            - $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Action to activate on row double-click, described as an action descriptor carrying its own
            `view` mode. A plain action name (e.g. `show`, `edit`, `create-invoice`) provided in code is
            normalized into this descriptor. Reserved view targets (`show`/`edit`/`create`/`list`) map to
            fixed frontend routes; absent means the default behaviour applies.
        single_click_action:
          allOf:
            - $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Action to activate on a single row click, described as an action descriptor carrying its own
            `view` mode (set `view.mode` to `sidepanel` to open a record preview beside the table). A plain
            action name provided in code is normalized into this descriptor. Absent means a single click
            does nothing.
      required:
        - reference
    GalleryBoxParameters:
      type: object
      description: |
        Gallery box parameters. Gallery box is used for displaying images from another resource as a carousel.
      properties:
        reference:
          type: string
          example: photos/photo
          description: Reference to another service resource.
        image_field:
          type: string
          example: image
          description: Name of the field containing the image object ({url, filename}).
        target:
          $ref: '#/components/schemas/TargetType'
        default_sorting:
          oneOf:
            - $ref: '#/components/schemas/SortDescriptor'
          description: Default ordering of the gallery.
        extra_filters:
          $ref: '#/components/schemas/FilterValues'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterDescriptor'
          description: List of filters which will be shown in the gallery view.
        schema_params:
          type: object
          description: Parameters that will be sent to get schema request.
      required:
        - reference
        - image_field
    TabBoxParameters:
      type: object
      description: |
        Tab box parameters. Present when box type is `tab`.
      properties:
        show_toolbar_navigation:
          type: boolean
          example: false
          description: Show previous/next navigation buttons in the box toolbar. Defaults to `false` for tab boxes.
    WizardBoxParameters:
      type: object
      description: |
        Wizard box parameters. Present when box type is `wizard`.
      properties:
        show_toolbar_navigation:
          type: boolean
          example: true
          description: Show previous/next navigation buttons in the box toolbar. Defaults to `true` for wizard boxes.
        validate_steps:
          type: boolean
          example: true
          description: Validate the current step before moving to the next one. Defaults to `true`.
    GridItemBoxParameters:
      type: object
      description: |
        Grid item box parameters. Grid is used to position boxes in the grid.
      properties:
        xs:
          type: integer
          example: 12
          description: Grid item width for xs breakpoint.
        sm:
          type: integer
          example: 6
          description: Grid item width for sm breakpoint.
        md:
          type: integer
          example: 4
          description: Grid item width for md breakpoint.
        lg:
          type: integer
          example: 3
          description: Grid item width for lg breakpoint.
        xl:
          type: integer
          example: 2
          description: Grid item width for xl breakpoint.
      required:
        - xs
        - sm
        - md
        - lg
        - xl
    ObjectBoxParameters:
      type: object
      description: |
        Object box parameters are used to show complex field (object or array type) in the view.
      properties:
        target:
          $ref: '#/components/schemas/TargetType'
      required:
        - target
    ArrayBoxParameters:
      type: object
      description: |
          Array box parameters are used to show array field in the view.
      properties:
          target:
            $ref: '#/components/schemas/TargetType'
          listed:
            $ref: '#/components/schemas/ListedOptions'
          inline:
            type: boolean
            example: true
            description: |
              Render the array items inline, like table rows. Defaults to `true` unless the box
              contains nested boxes.
      required:
          - target
    ListedOptions:
      type: object
      description: |
        Array box values will be listed according to choice field.
      properties:
        field_name:
          type: string
          example: field_name
          description: Field name used for listing.
        other_values:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          description: List of values which will not shown as the checkbox.
          nullable: true
        inline:
          type: boolean
          example: false
          description: Show be fields displayed inline like the table.
          nullable: true
    FilterDescriptorOptions:
      type: object
      description: |
        Field options are used for overriding field properties.
      nullable: true
      properties:
        prefix:
          type: string
          example: $
          description: Prefix for the field value. It can be used for units.
        postfix:
          type: string
          example: USD
          description: Postfix for the field value. It can be used for units.
    DynamicRenderOptions:
      type: object
      description: |
        Dynamic render is used for dynamic rendering of an element according to other field values.
      properties:
        show_query:
          type: string
          example: "is_active == true && is_admin == false"
          description: The element will be shown if query is true.
        required_query:
          type: string
          example: "is_active == true && is_admin == false"
          description: The element will be required if query is true.
    ChoicesFieldOptions:
      type: object
      description: Options specific to choices (select/radio) fields.
      properties:
        icons_key:
          type: string
          example: article_statuses
          description: Icons key defines key for list of icons used in the choices format.
    ImageFieldOptions:
      type: object
      description: Options specific to image fields.
      properties:
        resize_width:
          type: integer
          example: 100
          description: Resize width for the image field (in pixels).
        crop_aspect_ratio:
          type: number
          example: 1.5
          description: Crop aspect ratio for the image field (e.g. 1.5 for 3:2).
    RelationFieldOptions:
      type: object
      description: |
        Configuration for relation fields.
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
          description: Filter used to get values for relation field.
        sort:
          oneOf:
            - $ref: '#/components/schemas/SortDescriptor'
          description: Sorting used for relation field.
        preserve_order:
          type: boolean
          description: |
            Preserve order of the values in relation field according to the order of the values in the source field.
            Default value is `true` if sort is not set, otherwise default value is `false`.
        show_link:
          type: boolean
          description: Show link (default is true)
        link_mode:
          $ref: '#/components/schemas/ViewModeType'
        dialog_width:
          $ref: '#/components/schemas/DialogWidthType'
        keep_linked_parent:
          type: boolean
          description: |
            Should relation view keep parent object in the URL path when opened from relation field, default is `false`
        show_edit_button:
          type: boolean
          description: Show edit button next to input.
        show_create_button:
          type: boolean
          description: Show create button next to input.
        parent:
          type: string
          example: parent_field_name
          description: Parent field name for the tree structure (tree-relation fields).
    AiFieldOptions:
      type: object
      description: Options specific to AI-assisted fields.
      properties:
        source_fields:
          type: array
          items:
            type: string
          description: List of field names used as context for AI auto-completion. Empty list means all fields.
    FieldOptions:
      type: object
      description: |
        Field options are used for defining extra field properties.
      nullable: true
      properties:
        choices:
          $ref: '#/components/schemas/ChoicesFieldOptions'
        image:
          $ref: '#/components/schemas/ImageFieldOptions'
        ai:
          $ref: '#/components/schemas/AiFieldOptions'
        dynamic_render:
          $ref: '#/components/schemas/DynamicRenderOptions'
        validators:
          type: array
          description: |
            Validation rules enforced by the frontend before submit. The rules are auto-extracted
            from the serializer field constraints (`max_length`, `min_length`, `max_value`,
            `min_value` and the first `RegexValidator` in `field.validators`) and can be overridden
            per rule type via the `validators` argument of the `Field` descriptor or the field
            options. Backend validation is always performed regardless of this configuration. At
            most one rule per `type` is expected.
          items:
            $ref: '#/components/schemas/ValidatorRule'
        relation:
          $ref: '#/components/schemas/RelationFieldOptions'
        text_align:
          $ref: '#/components/schemas/TextAlignType'
        number:
          $ref: '#/components/schemas/NumberFieldOptions'
        prefix:
          type: string
          example: $
          description: Prefix for the field value. It can be used for units.
        postfix:
          type: string
          example: USD
          description: Postfix for the field value. It can be used for units.
        phone:
          $ref: '#/components/schemas/PhoneFieldOptions'
        target:
          $ref: '#/components/schemas/LinkTargetType'
        upload:
          $ref: '#/components/schemas/UploadFieldOptions'
        max_size:
          type: integer
          example: 5242880
          description: |
            Largest file in bytes the frontend accepts for this field, checked before the upload
            starts (`file.size > max_size` is refused). Backend validation is always performed
            regardless of this value - this only spares the user an upload that would be refused
            anyway. When a chunked-upload provider serves the field, this is the same ceiling its
            `initiate` endpoint enforces; omitted when the field declares no limit of its own.

            A project may set it directly; the field's own `MaxFileSizeValidator` fills it
            automatically, without overriding a value set by hand. With `habarico-enterprise`
            installed, the project-wide upload size ceiling is folded in too for a field a
            chunked-upload provider actually serves.
        accept:
          type: array
          items:
            type: string
          example:
            - image/png
            - image/jpeg
          description: |
            File types the frontend accepts for this field, checked before the upload starts. An
            entry is a filename extension (`.png`), a concrete media type (`image/png`) or a
            media-type wildcard (`image/*`). Backend validation is always performed regardless of
            this list. Omitted when the field declares no restriction, or when its restriction
            cannot be expressed in this form - the frontend must not treat an absent `accept` as
            "everything is allowed server-side".

            A project may set it directly; the field's own `FileExtensionValidator` (or, for an
            image field, Django's `validate_image_file_extension`) fills it automatically, without
            overriding a value set by hand.

            A project may set it directly; `habarico-enterprise` also fills it from the field's own
            declared content-type validation, without overriding a value set by hand.
    NumberFieldOptions:
      type: object
      description: |
        Intl.NumberFormat options used for number formatting.
      nullable: true
      properties:
        style:
          type: string
          example: unit
          description: Number format style.
          enum:
            - unit
            - currency
        currency:
          type: string
          example: USD
          description: Currency code used for currency format.
        unit:
          type: string
          example: meter
          description: Unit code used for unit format.
        minimum_fraction_digits:
          type: integer
          example: 2
          description: Minimum number of fraction digits.
        maximum_fraction_digits:
          type: integer
          example: 2
          description: Maximum number of fraction digits.
    PhoneFieldOptions:
      type: object
      description: |
        Phone format options used for phone field.
      properties:
        default_region:
          type: string
          example: CZ
          description: Default region used for phone number defined in  ISO 3166-1
        allowed_regions:
          type: array
          items:
            type: string
          description: List of allowed regions used for phone number defined in ISO 3166-1
    UploadFieldOptions:
      type: object
      x-habarico-tier: enterprise
      description: |
        **Premium** — part of the paid `habarico-enterprise` package; absent from a free-only install.

        Present only when a chunked upload provider is configured. Tells the frontend to
        switch from base64 to chunked upload when the file exceeds `threshold` bytes.

        On POST/PUT a file/image field accepts EITHER the existing base64 payload (the
        `content`/`filename`/... object) OR an object `{"upload_key": "<key returned by
        complete>"}` referencing a chunk-uploaded file.

        This object is a discriminated union: `provider` selects the active provider and
        determines which provider-specific fields are present. `initiate_url` and `endpoint`
        are mutually exclusive – exactly one is returned per field, never both. Clients must
        branch on `provider`, not on the presence of a particular field.
      properties:
        provider:
          type: string
          enum:
            - s3-multipart
            - tus
        threshold:
          type: integer
          description: Byte size at/above which chunked upload is used.
        chunk_size:
          type: integer
          description: Size in bytes of a single chunk/part the frontend should slice the file into.
        min_chunk_size:
          type: integer
          description: |
            Present only for provider `s3-multipart`. The S3 hard minimum part size in bytes
            (every part except the last must be at least this large). The frontend uses it to
            decide multipart vs. a single upload before calling `initiate` - a file smaller than
            this cannot be split into multiple parts.
        initiate_url:
          type: string
          description: |
            Present only for provider `s3-multipart`. URL of the Habarico initiate
            endpoint (`/admin/uploads/initiate`, already carrying the opaque `target` query
            param) that the frontend POSTs to in order to start the two-step S3 flow
            (initiate → upload parts directly to storage → complete). It is an action URL
            on this service, not the storage URL.
        endpoint:
          type: string
          description: |
            Present only for provider `tus`. Base URL of the external tusd service that the
            tus client uploads to directly; Habarico only advertises it and later finalizes
            the result. It is the upload target itself, not a Habarico endpoint.
    BoxOptions:
      type: object
      description: |
        Box options are used for defining extra box properties.
      nullable: true
      properties:
        dynamic_render:
          $ref: '#/components/schemas/DynamicRenderOptions'
    ListViewParameters:
      type: object
      nullable: true
      description: |
        List view parameters, required if type is `list`.
      properties:
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/FieldDescriptor'
          description: |
            List of fields and it's configuration which will be shown in the list view.
            Null value means all fields will be shown.
        row_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered as inline buttons on each table row (e.g. edit, delete).
            Null means all supported object actions are shown.
        toolbar_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered in the toolbar above the table (e.g. create, bulk delete).
            Null means all supported actions are shown.
          nullable: true
        list_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Utility actions rendered next to the filter bar, separate from row and toolbar actions
            (e.g. export, print). Absent when not configured.
          nullable: true
        default_sorting:
          oneOf:
            - $ref: '#/components/schemas/SortDescriptor'
          description: Default ordering of the list.
        extra_filters:
          $ref: '#/components/schemas/FilterValues'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterDescriptor'
          description: List of filters which will be shown in the list view.
        sortable:
          oneOf:
            - $ref: '#/components/schemas/SortableParameters'
          description: |
            List box can be drag & drop sortable. If sortable is set, list will be sortable.
        double_click_action:
          allOf:
            - $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Action to activate on row double-click, described as an action descriptor carrying its own
            `view` mode. A plain action name (e.g. `show`, `edit`, `create-invoice`) provided in code is
            normalized into this descriptor. Reserved view targets (`show`/`edit`/`create`/`list`) map to
            fixed frontend routes; absent means the default behaviour applies.
        single_click_action:
          allOf:
            - $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Action to activate on a single row click, described as an action descriptor carrying its own
            `view` mode (set `view.mode` to `sidepanel` to open a record preview beside the table). A plain
            action name provided in code is normalized into this descriptor. Emitted only when the target
            view is available; absent means a single click does nothing.
    DetailViewParameters:
      type: object
      description: |
        Detail view parameters, required if type is `show`, `edit` or `create`.
      properties:
        box:
          allOf:
            - $ref: '#/components/schemas/BoxSchema'
          description: Box schema used for displaying detail layout.
        toolbar_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered in the toolbar at the top of the view (e.g. delete, custom actions).
            Null means all supported actions are shown.
          nullable: true
        bottom_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: |
            Actions rendered at the bottom of the view below the form fields (e.g. save, cancel).
            Null means all supported actions are shown.
          nullable: true
      required:
        - box
    FieldWrapperProperties:
      type: object
      description: |
        Wrapper field around more fields. Wrapper is used for grouping fields.
      properties:
        divider:
          type: string
          example: ", "
          description: Separator used for joining field values.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDescriptor'
          description: List of fields inside the wrapper.
    # Descriptors - it is just an identifier of existing object with possibility to override some properties.
    FieldDescriptor:
      type: object
      description: |
        Field descriptor is used for defining field that are shown in a view.
      properties:
        type:
          type: string
          enum:
            - field
          description: Descriptor type. Always set to 'field'.
        name:
          type: string
          example: field_name
          description: Field name.
        label:
          type: string
          example: Field label
          description: Field label that overrides default field label. If not set, field name is used.
        short_label:
          type: string
          example: Short field label
          description: Short field label used as header in the list view. If not set, field label is used.
        help_text:
          type: string
          example: Field help text
          description: Field help text used as a form field tooltip. If not set, field help text is used.
        sortable:
          type: boolean
          example: false
          description: Defines if field is sortable. Default value is false.
        sort_by:
          type: string
          example: field_name
          description: Field name used for sorting. If not set, field name is used.
        read_only:
          type: boolean
          example: false
          description: Defines if field is read only. Default value is false.
        write_only:
          type: boolean
          example: false
          description: Defines if field is write only. Default value is false.
        default_value:
          example: default_value
          description: Default field value that overrides default field value. If not set, default field value is used.
        action:
          oneOf:
            - $ref: '#/components/schemas/ActionDescriptor'
            - $ref: '#/components/schemas/ActionSchema'
          description: Action that is shown in the field.
        wrapper:
          $ref: '#/components/schemas/FieldWrapperProperties'
        options:
          $ref: '#/components/schemas/FieldOptions'
      required:
        - type
        - name
    ActionDescriptor:
      type: object
      description: |
        Field descriptor is used for defining action that are shown in a view.
      properties:
        name:
          type: string
          example: field_name
          description: Action name.
        label:
          type: string
          example: Action label
          description: Action label that overrides default action label. If not set, action name is used.
        icon:
          type: string
          example: Action icon
          description: Action icon that overrides default action icon. If not set, default icon is used.
        color:
          oneOf:
            - $ref: '#/components/schemas/ColorType'
          description: Action color that overrides default action color. If not set, default color is used.
        action:
          oneOf:
            - $ref: '#/components/schemas/ActionSchema'
          description: Action that is shown in the field.
        view:
          oneOf:
            - $ref: '#/components/schemas/ViewActionDescriptorParameters'
          description: View that is shown in the field.
        menu_items:
          type: array
          items:
            $ref: '#/components/schemas/ActionDescriptor'
          description: List of sub actions which will be shown in the action menu.
          nullable: true
      required:
        - name
    SortDescriptor:
      type: object
      description: |
        Sort descriptor is used for defining ordering of the list, table or selectbox items of an objects.
      properties:
        field_name:
          type: string
          example: field_name
          description: Field name used for ordering.
        direction:
          $ref: '#/components/schemas/SortDirectionType'
      required:
        - field_name
        - direction
    FilterDescriptor:
      type: object
      description: |
        Filter descriptor is used for defining filter that are shown in a view.
      properties:
        name:
          type: string
          example: filter_name
          description: Filter name.
        label:
          type: string
          example: Filter label
          description: Filter label that overrides default filter label. If not set, filter name is used.
        help_text:
          type: string
          example: Field help text
          description: Field help text used as a filter tooltip. If not set, filter help text is used.
        is_always_on:
          type: boolean
          example: false
          description: >-
            Defines if the filter is always displayed. If true, the filter is shown at all times;
            if false, it is hidden among the background (advanced) filters. Default value is false.
        default_value:
          example: default_value
          description: Default filter value that overrides default filter value. If not set, default filter value is used.
        options:
          $ref: '#/components/schemas/FilterDescriptorOptions'
      required:
        - name
    # Schemas
