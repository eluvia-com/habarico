include:
  - component: $CI_SERVER_FQDN/gitlab-ci/ci-toolbox/node-library@2


workflow:
  name: "Habarico - Node Library"


# Everything Storybook, in one job: it needs a browser and more memory than the default
# runner pool allows, so it cannot ride along with the component's jobs.
storybook-tests:
  stage: test
  # Not the component's node:${NODE_VERSION}: that image ships no browser, so every run paid for
  # an `apt-get` plus a Chromium download before the first test - the slowest and by far the least
  # predictable part of the job. Playwright publishes an image with the browsers and their shared
  # libraries baked in, built on Node 24, the same major the component pins, so `npm ci` resolves
  # exactly what it resolved before.
  #
  # The tag has to stay in step with `playwright` in package.json: the browser revision the library
  # asks for is the one baked into /ms-playwright, and a mismatch is a hard failure ("Executable
  # doesn't exist"). The install step below absorbs a drift, but bump the two together anyway.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  tags:
    # Not $NODE_JOB_TAGS (empty -> default pool): that pool refuses any limit above 2Gi,
    # and Chromium needs several times that. "high-resources" is the same larger pool
    # `publish` uses in the root .gitlab-ci.yml.
    - high-resources
  # A wedged Chromium produces no output at all, and the runner only gives up after
  # ~35 minutes of silence (that is how the first run failed: `no_updates_running`).
  # The suite itself takes ~2 minutes, so cap the job and fail fast instead.
  timeout: 20 minutes
  variables:
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    # Measured peak for the whole process tree is ~3.2Gi, and the heaviest stories
    # (schema/pages/*) run last - at a 4Gi limit the run died on exactly those. 6Gi
    # leaves real headroom rather than sitting 800Mi under the ceiling.
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    # Nothing here needs to phone home, and it is one less thing to fail on a slow network.
    STORYBOOK_DISABLE_TELEMETRY: "1"
  # This job installs for itself, and the tree behind Storybook (React Admin, MUI and the Vite
  # toolchain) is the better part of a gigabyte - so the download is cached, keyed by the lockfile
  # that decides it.
  # Cache paths are relative to the project root rather than to the job's cwd, hence the prefix.
  cache:
    key:
      files:
        - node/package-lock.json
    paths:
      - node/.npm
  script:
    - npm ci --cache .npm --prefer-offline
    # The browsers come with the image, so on a matching version this only prints that they are
    # already installed. It earns its second when package.json has drifted off the image tag: the
    # missing revision is fetched instead of failing the run. No --with-deps - the shared libraries
    # are part of the image, and that apt-get is what this job stopped paying for.
    - npx playwright install chromium
    # Renders every exported story in headless Chromium and fails if one throws.
    - npm run test:storybook
    # Still worth its own step after the tests: @storybook/addon-vitest runs with
    # `disableAddonDocs`, so the autodocs/MDX side of the build is the one thing the story
    # tests above do not exercise.
    - npm run build-storybook
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      # On failure vitest writes a screenshot of the story that failed next to it
      # (`browser.screenshotFailures` in vitest.config.ts). Artifact paths are relative to
      # the project root, not to the job's cwd, hence the $WORKDIR prefix.
      - $WORKDIR/src/**/__screenshots__/
  rules:
    - !reference [.rules, skip-master]
    - if: $CI_MERGE_REQUEST_ID


# storybook.habarico.com: the built Storybook, uploaded into a Spaces bucket the ingress serves
# (HAB-763). The same pattern the documentation site uses since HAB-840 - no image, no deploy
# trigger, the objects *are* the deployment.
#
# Published from final major/minor tags only (`node@X.Y.0`). Test and production serve the same
# bucket root, so whatever is published here is live at once, and the build is too expensive to
# pay for more often than the series moves. That is also what `<series>/` below is for: a
# documentation page links the Storybook of its own minor series (`storybookSeriesUrl` in
# hab-docs), and that prefix is written exactly on these tags. A patch release therefore
# publishes nothing here - unlike the documentation site, which is published from every stable
# tag of `habarico-enterprise`, patches included (HAB-872).
#
# Uploaded twice. The root is what `storybookUrl` points at and what an unversioned link reaches;
# `<series>/` is the same build under its minor series, which is what a documentation page of that
# series links at. Inside a series each release overwrites the prefix, so when the next series
# starts, the previous one freezes in its last shape - at the cost of one copy per series.
.storybook-build:
  stage: publish
  tags:
    # Building Storybook is what `storybook-tests` above measured at ~3.2Gi; same pool, same
    # reason.
    - high-resources
  timeout: 20 minutes
  variables:
    KUBERNETES_MEMORY_REQUEST: "3Gi"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    STORYBOOK_DISABLE_TELEMETRY: "1"
  script:
    - npm ci
    - npm run build-storybook
    # The uploader is scripts/upload-bucket.mjs here since HAB-873, when the documentation site
    # left this repository and took its own copy with it. Its only runtime dependency is the AWS
    # SDK, imported dynamically - installed here rather than carried in devDependencies, where
    # every `npm ci` of every job would pay for it.
    - npm install --no-save @aws-sdk/client-s3

publish-storybook:
  extends: .storybook-build
  script:
    - !reference [.storybook-build, script]
    # "node@6.8.0" -> "6.8".
    - series=$(echo "${CI_COMMIT_TAG##*@}" | cut -d. -f1-2)
    # --no-asset-pool on both: Storybook addresses its assets relatively, so they have to stay
    # inside the prefix they are served from. At the root the flag changes nothing (the prefix is
    # empty), and passing it there too keeps the two uploads the same build.
    #
    # The bucket is STORYBOOK_BUCKET* (HAB-854) and this copy of the uploader defaults to it, so
    # there is no --bucket-env to pass and no family to get wrong: a missing STORYBOOK_BUCKET*
    # fails the job by that name.
    - node scripts/upload-bucket.mjs --dir storybook-static --no-asset-pool
    - node scripts/upload-bucket.mjs --dir storybook-static --no-asset-pool --prefix "$series"
  rules:
    # Not $RELEASE_TAG_MATCH: the component's pattern is `/^node@/`, which takes a patch tag as
    # well, because that is what `publish` (npm) runs on. This job runs on major/minor finals
    # only - see above.
    - if: '$CI_COMMIT_TAG =~ /^node@\d+\.\d+\.0$/'


# The preview: the Storybook of `next` under `next/`, which the test host serves in place of the
# root and production answers with 404 (hab-deploy, static-sites.yml). It is what the preview of
# the documentation (`publish-docs-next` in hab-docs) links. By hand only, on a pipeline of `next`
# - one exists whenever a merge moved the beta of this library - because the build costs the
# `high-resources` runner.
#
# `--prune` keeps the prefix one build rather than the sum of all of them, and
# `--allow-large-prune` lets it replace most of it: nearly every file of a Storybook build is a
# content-hashed chunk, so a change to the library renames most of the prefix. The check that the
# plan holds `next/index.html` still stands.
publish-storybook-next:
  extends: .storybook-build
  script:
    - !reference [.storybook-build, script]
    - node scripts/upload-bucket.mjs --dir storybook-static --no-asset-pool --prefix next --prune --allow-large-prune
  rules:
    - if: $CI_COMMIT_BRANCH == $NEXT_BRANCH
      when: manual
      allow_failure: true
