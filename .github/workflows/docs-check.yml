# Builds the whole documentation site against this pull request: `onBrokenLinks: throw` fails it on a
# renamed heading or a moved page. The site is generated by `hab-docs` and holds the paid pages of
# `habarico-enterprise` too, both on GitLab - see "Documentation checks" in .github/README.md.
name: Docs check

on:
  pull_request:
    paths:
      - "*/docs/**"
      - "contract/openapi.yaml"
      - "contract/schema.svg"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets, so it could not clone the GitLab repositories.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    env:
      # A branch of the same name in hab-docs and habarico-enterprise is built against when it exists,
      # so a change spanning the repositories can be verified before either half is merged.
      DOCS_CHECK_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Authenticate to GitLab
        env:
          GITLAB_DOCS_TOKEN_USER: ${{ vars.GITLAB_DOCS_TOKEN_USER }}
          GITLAB_DOCS_TOKEN: ${{ secrets.GITLAB_DOCS_TOKEN }}
        run: |
          set -eu
          if [ -z "${GITLAB_DOCS_TOKEN_USER:-}" ] || [ -z "${GITLAB_DOCS_TOKEN:-}" ]; then
            echo "ERROR: the GITLAB_DOCS_TOKEN_USER variable or the GITLAB_DOCS_TOKEN secret is not set - see .github/OPERATIONS.md"
            exit 1
          fi
          # hab-docs' scripts clone over plain https; this hands every such URL the deploy token.
          git config --global \
            "url.https://${GITLAB_DOCS_TOKEN_USER}:${GITLAB_DOCS_TOKEN}@gitlab.eluvia.dev/.insteadOf" \
            "https://gitlab.eluvia.dev/"

      - name: Clone hab-docs
        run: |
          set -eu
          url="https://gitlab.eluvia.dev/eluvia/habarico/hab-docs.git"
          ref="$DOCS_CHECK_REF"
          # Exit code 2 is "no such branch"; anything else is a failure to reach or read the repository.
          status=0
          git ls-remote --exit-code --heads "$url" "$ref" >/dev/null || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || exit "$status"
          [ "$status" -eq 0 ] || ref="master"
          echo "building with hab-docs at $ref"
          git clone --quiet --depth 1 --branch "$ref" "$url" "$RUNNER_TEMP/hab-docs"

      - name: Build the site
        env:
          HABARICO_PATH: ${{ github.workspace }}
        run: '"$RUNNER_TEMP/hab-docs/scripts/docs-check.sh"'
