# The finalize button. Releases every library whose directory has moved since its last stable tag -
# with SHARED_MINOR_MAJOR every library once any of them moved - all of them together, and pushes
# the tags that start publish.yml. It publishes nothing itself.
#
# Port of release-next-final from ci-toolbox/monorepo-library@2. The ordering below is not
# cosmetic - each step is where it is for a reason, kept from the original.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Work out the release and print it, but push nothing"
        type: boolean
        default: false

# Two finalize runs at once would race on the trunk.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # A hung run would hold the `release` concurrency group for the default six hours.
    timeout-minutes: 15
    # Carries pydev, which reads each library's version file through its .pydev/base.yml.
    # Public upstream image; set TOOLBOX_IMAGE only to override it. See publish.yml for the note
    # on it being Alpine-based.
    container: ${{ vars.TOOLBOX_IMAGE || 'ghcr.io/druids/developers-chamber:1' }}
    env:
      # Hard-coded in publish.yml's trigger, because `on:` has no contexts. Kept configurable here,
      # where expressions do work - but the two have to agree.
      NEXT_BRANCH: ${{ vars.NEXT_BRANCH || 'next' }}
      STABLE_BRANCH: ${{ vars.STABLE_BRANCH || 'master' }}
      # The level a version file still on a released version is released at. beta-bump.yml starts
      # a new cycle at the same level - if they disagreed, a beta would be numbered off a target
      # that never ships.
      RELEASE_LEVEL: ${{ vars.RELEASE_LEVEL || 'minor' }}
      # "true" releases every library together whenever one of them moved. Same variable
      # beta-bump.yml and major.yml read.
      SHARED_MINOR_MAJOR: ${{ vars.SHARED_MINOR_MAJOR || 'true' }}
      CHANGELOG_PATH: CHANGELOG.md
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN deliberately do not
      # start further workflow runs, so the release tags would never trigger publish.yml. The App
      # needs contents:write and a ruleset bypass on both branches.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # Tags are the comparison base, and the stable branch has to be here to fast-forward it.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare git
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # Work on the real tip of the trunk, not on whatever the dispatch happened to see.
          git fetch origin "$NEXT_BRANCH" "$STABLE_BRANCH"
          git switch -C "$NEXT_BRANCH" "origin/$NEXT_BRANCH"

      # Everything from here to the commit only reads. Nothing is written or pushed until all the
      # checks pass, so a rejected release leaves the repository exactly as it was.
      - name: Check the stable branch can be fast-forwarded
        run: |
          set -eu
          if ! git merge-base --is-ancestor "origin/$STABLE_BRANCH" "origin/$NEXT_BRANCH"; then
            echo "ERROR: $STABLE_BRANCH is not an ancestor of $NEXT_BRANCH - someone committed to"
            echo "$STABLE_BRANCH outside this flow, or the branches were never aligned."
            echo "Fix it once by merging origin/$STABLE_BRANCH into $NEXT_BRANCH and pushing."
            exit 1
          fi

      - name: Work out what to release
        run: |
          set -eu

          . .github/scripts/libraries.sh
          list_libs
          check_shared_minor_major

          : > /tmp/to_release
          : > /tmp/aligned
          CHANGED=""
          for lib in $LIBS; do
            # `-r release` strips the pre-release suffix of the open cycle: 7.3.0-beta.4 -> 7.3.0.
            LEVEL=release
            VERSION=$(cd "$lib" && pydev version print-next -r release)

            # No beta was bumped since the last release, so the file still names the released
            # version - release the next one at RELEASE_LEVEL, as beta-bump.yml would have.
            if git rev-parse -q --verify "refs/tags/${lib}@${VERSION}" >/dev/null; then
              LEVEL=$RELEASE_LEVEL
              VERSION=$(cd "$lib" && pydev version print-next -r "$LEVEL")
              echo "  $lib: version file still on the released ${lib}@$(cd "$lib" && pydev version print), releasing $VERSION"
            fi

            BASE=$(git tag -l "${lib}@*" --sort=-v:refname | grep -vE -- '-(alpha|beta|rc)\.' | head -1 || true)

            # With SHARED_MINOR_MAJOR every library is released whenever one of them moved, so
            # "unchanged" here only decides the changelog: no commit under <lib>/ since its last
            # tag other than version bumps.
            if [ "$SHARED_MINOR_MAJOR" = "true" ]; then
              echo "$lib $VERSION $LEVEL" >> /tmp/to_release
              if [ -n "$BASE" ] && [ -z "$(git log --format=%H --invert-grep --grep '^Bump version to' "$BASE..HEAD" -- "$lib/")" ]; then
                echo "  $lib: -> $VERSION (no changes since $BASE, aligned with the other libraries)"
                echo "$lib" >> /tmp/aligned
              else
                echo "  $lib: -> $VERSION"
                CHANGED="$CHANGED $lib"
              fi
              continue
            fi

            if [ -n "$BASE" ] && git diff --quiet "$BASE" HEAD -- "$lib/"; then
              echo "  $lib: unchanged since $BASE, skipping"
              continue
            fi

            echo "  $lib: -> $VERSION"
            echo "$lib $VERSION $LEVEL" >> /tmp/to_release
          done

          if [ "$SHARED_MINOR_MAJOR" = "true" ] && [ -z "$CHANGED" ]; then
            : > /tmp/to_release
          fi

          if [ ! -s /tmp/to_release ]; then
            echo "nothing to release - no library has moved since its last stable tag"
          fi

      - name: Stamp the changelogs and commit
        run: |
          set -eu
          [ -s /tmp/to_release ] || exit 0

          SUMMARY=""
          while read -r lib version level; do
            # The tag has to point at a tree whose version file names the released version.
            (cd "$lib" && pydev version bump-to-next -r "$level")
            [ "$(cd "$lib" && pydev version print)" = "$version" ] || { echo "ERROR: $lib version file does not say $version"; exit 1; }
            git add "$lib"

            if [ -f "$lib/$CHANGELOG_PATH" ]; then
              TODAY=$(date +%Y-%m-%d)
              if grep -qx "$lib" /tmp/aligned; then
                # A library released only to follow the shared version gets a section saying so.
                # An empty "## [Unreleased]" heading is dropped, the new section goes above the first one.
                awk -v section="## [${version}] — ${TODAY}\n\n### Changed\n- No changes. Version aligned with the other libraries in the repository.\n" '
                  /^## \[Unreleased\]/ { skip = 1; next }
                  skip && /^[[:space:]]*$/ { next }
                  { skip = 0 }
                  !done && /^## / { print section; done = 1 }
                  { print }
                  END { if (!done) { print ""; print section } }
                ' "$lib/$CHANGELOG_PATH" > /tmp/changelog && mv /tmp/changelog "$lib/$CHANGELOG_PATH"
              else
                sed -i "s/## \[Unreleased\]/## [${version}] — ${TODAY}/" "$lib/$CHANGELOG_PATH"
              fi
              git add "$lib/$CHANGELOG_PATH"
            fi
            SUMMARY="${SUMMARY}${SUMMARY:+, }${lib}@${version}"
          done < /tmp/to_release

          # The "Bump version to" prefix keeps beta-bump.yml from bumping on this commit, and it is
          # the last bump commit beta-bump.yml diffs against when the next cycle starts.
          git commit -m "Bump version to ${SUMMARY}"
          echo "release commit: $(git rev-parse --short HEAD)"

      - name: Push
        run: |
          set -eu
          [ -s /tmp/to_release ] || exit 0

          TAGS=""
          while read -r lib version _; do
            git tag "${lib}@${version}"
            TAGS="$TAGS ${lib}@${version}"
          done < /tmp/to_release

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run - would push $NEXT_BRANCH, fast-forward $STABLE_BRANCH and push:$TAGS"
            exit 0
          fi

          # Order matters: trunk first, then fast-forward the stable branch, then the tags. Tags are
          # last because they start the publishes - if anything above fails, nothing has reached a
          # registry yet and the state is still recoverable.
          git push origin "$NEXT_BRANCH"
          git push origin "$NEXT_BRANCH:$STABLE_BRANCH"
          # shellcheck disable=SC2086
          git push origin $TAGS
          echo "released:$TAGS"

      - name: Maintenance branches
        run: |
          set -eu
          [ -s /tmp/to_release ] || exit 0

          # One per released library, so a patch has somewhere to start without anyone having to cut
          # it by hand while something is burning. An existing branch is left strictly alone - it may
          # already carry cherry-picked fixes, and moving it would throw them away.
          NEW=""
          while read -r lib version _; do
            BRANCH="release/${lib}@v$(echo "$version" | cut -d. -f1,2)"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "  $BRANCH already exists, leaving it as it is"
            else
              git update-ref "refs/heads/$BRANCH" HEAD
              NEW="$NEW $BRANCH"
            fi
          done < /tmp/to_release

          if [ -z "$NEW" ]; then
            echo "no maintenance branches created"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "dry run - would create:$NEW"
          else
            # shellcheck disable=SC2086
            git push origin $NEW
            echo "maintenance branches:$NEW"
          fi
