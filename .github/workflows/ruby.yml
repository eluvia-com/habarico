# Checks of the Ruby library (ci-toolbox/ruby-library@2 with its unit tests on). This workflow
# only runs checks; publishing lives in publish.yml - see .github/WORKFLOWS.md.
name: Ruby

# Every pull request runs every library's checks, so each job reports a status the `next` ruleset
# can require; a workflow skipped by a `paths` filter would leave that check pending forever.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ruby-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ruby

jobs:
  ruby-code-quality:
    name: ruby-code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `ruby-version` is left unset on purpose: the action then reads .ruby-version from
      # `working-directory`, i.e. ruby/.ruby-version (latest 3.2.x).
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby

      # rubocop is not in the Gemfile - the template installs it standalone, and .rubocop.yml
      # relies on recent cops (Style/OneClassPerFile, Style/HashFetchChain), so the latest
      # release is what the config is written against.
      - name: Install RuboCop
        run: gem install rubocop

      - run: rubocop

  # One job per supported Rails minor, each on a Ruby it supports (oldest with oldest), rather than
  # the full Ruby x Rails product.
  ruby-unit-tests-matrix:
    name: ruby-unit-tests (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.2", rails: "7.2", gemfile: rails_7_2 }
          - { ruby: "3.4", rails: "8.0", gemfile: rails_8_0 }
          - { ruby: "4.0", rails: "8.1", gemfile: rails_8_1 }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ruby/gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v5

      # bundler-cache handles `bundle install` plus caching of the resolved gems, for the
      # Gemfile BUNDLE_GEMFILE names.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # TEST_COMMAND from ci-toolbox/ruby-library@2. The Rakefile's :test task covers
      # test/unit, test/integration and test/contrib; the integration suite runs on sqlite3.
      - run: bundle exec rake test

  # The check the `next` ruleset requires: it matches by name, so the matrix jobs above report
  # through this one.
  ruby-unit-tests:
    name: ruby-unit-tests
    needs: ruby-unit-tests-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ruby-unit-tests-matrix.result }}" = success
        working-directory: .
