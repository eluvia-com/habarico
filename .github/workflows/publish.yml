# The only workflow that publishes anything. Betas come from a push to the trunk, stable releases
# from a release tag; both go through the same jobs so they cannot drift apart. Keeping it in one
# file also keeps the trusted-publisher configuration in all three registries identical - they
# match on the workflow filename. See .github/RELEASE-DESIGN.md.
#
# Betas and stable releases go to the public registries only: python to PyPI, ruby to
# rubygems.org, node to npmjs.com once PUBLISH_NPM is set. See "Going public" in
# .github/README.md.
name: Publish

on:
  push:
    # Betas. A merge to next does not publish by itself - beta-bump.yml commits a version bump for
    # every library that moved, and it is THAT push (matched by the detect job's `if:` below) that
    # reaches the publish logic. The merge's own run of this workflow is a no-op.
    #
    # Hard-coded, unlike everything else here: `on:` is evaluated before any context exists, so
    # neither `vars` nor `env` can be used in a trigger. Renaming the trunk means editing this line
    # and the matching ones in release.yml and beta-bump.yml.
    branches:
      - next
    # Stable releases, pushed by release.yml.
    tags:
      - "*@*"

# Never cancel a publish half-way. An interrupted upload is the one failure mode that cannot be
# retried cleanly.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    # Carries pydev, which reads each library's version file through its .pydev/base.yml.
    # The upstream image is public, so nothing has to be configured for this to run; set the
    # TOOLBOX_IMAGE variable only to try a different build. It is Alpine-based - the runner
    # mounts its musl Node build for the JavaScript actions, which is why they work here.
    container: ${{ vars.TOOLBOX_IMAGE || 'ghcr.io/druids/developers-chamber:1' }}
    # A tag always names an exact release - no further check needed. A branch push only reaches
    # here when beta-bump.yml's own commit named a prerelease; an ordinary merge, release.yml's
    # finalize commit and its advance commit all fail this and the run does nothing.
    if: >-
      github.ref_type == 'tag' ||
      (startsWith(github.event.head_commit.message, 'Bump version to') &&
       (contains(github.event.head_commit.message, '-alpha.') ||
        contains(github.event.head_commit.message, '-beta.') ||
        contains(github.event.head_commit.message, '-rc.')))
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch case only needs to diff HEAD against its own parent (see below); the tag
          # case needs no history at all. Neither needs the full clone the old counter-based
          # derivation did.
          fetch-depth: 2

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: detect
        run: |
          set -eu

          # A tag names both the library and the exact version - nothing to derive.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            LIB="${GITHUB_REF_NAME%@*}"
            VER="${GITHUB_REF_NAME##*@}"
            echo "  $LIB: $VER (from tag)"
            python3 -c "import json,sys; print('versions=' + json.dumps({sys.argv[1]: sys.argv[2]}))" \
              "$LIB" "$VER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          . .github/scripts/libraries.sh
          list_libs

          # A branch push only reaches this point when it is beta-bump.yml's own commit (the `if:`
          # above filtered everything else out), so this exact commit named which libraries it
          # bumped and each one's version file already carries the version to publish - nothing to
          # derive, just read it back per library this commit actually touched.
          : > /tmp/publish.txt
          for lib in $LIBS; do
            if git --no-optional-locks diff --quiet HEAD~1 HEAD -- "$lib/"; then
              echo "  $lib: not touched by this commit, skipping"
              continue
            fi

            VERSION=$(cd "$lib" && pydev version print)
            case "$VERSION" in
              *-alpha.*|*-beta.*|*-rc.*)
                echo "  $lib: $VERSION"
                echo "${lib} ${VERSION}" >> /tmp/publish.txt
                ;;
              *)
                # Defensive: the job-level `if:` already guarantees this commit names a prerelease
                # somewhere, but not necessarily in every library it touched.
                echo "  $lib: touched, but its version carries no prerelease marker ($VERSION) - skipping"
                ;;
            esac
          done

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('/tmp/publish.txt') as f:
              pairs = dict(line.split() for line in f if line.strip())
          print('versions=' + json.dumps(pairs))
          PY

  node:
    name: node
    needs: detect
    if: fromJSON(needs.detect.outputs.versions).node
    runs-on: ubuntu-latest
    # Pinned in the npm trusted publisher configuration.
    environment: release
    permissions:
      contents: read
      # Required for OIDC trusted publishing on npmjs.com; also what makes npm attach provenance.
      id-token: write
    defaults:
      run:
        working-directory: node
    env:
      VERSION: ${{ fromJSON(needs.detect.outputs.versions).node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node/package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships something recent enough today,
      # but the publish is not the place to find out that it stopped being true.
      - run: npm install -g npm@latest

      - run: npm ci

      # A beta version is derived, never committed, so the file has to be told what it is. Stable
      # releases pass the version the tag already carries, hence --allow-same-version.
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - run: npm run build

      # Betas and stable releases both go to npmjs.com, betas under the `beta` dist-tag. Only once
      # PUBLISH_NPM is set: an upload to npmjs.com cannot be undone.
      - name: Publish to npmjs.com
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        run: |
          set -eu
          # npm refuses to publish a pre-release without an explicit --tag: it would otherwise move
          # the "latest" dist-tag onto a beta.
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*) DIST_TAG=beta ;;
            *) DIST_TAG=latest ;;
          esac

          if OUTPUT=$(npm publish --registry=https://registry.npmjs.org/ --provenance --access public --tag "$DIST_TAG" 2>&1); then
            echo "$OUTPUT"
          else
            echo "$OUTPUT"
            # Re-publishing a version is not an error: a retried job lands here.
            case "$(echo "$OUTPUT" | tr '[:upper:]' '[:lower:]')" in
              *epublishconflict*|*"cannot publish over"*)
                echo "this version is already on npmjs.com - continuing" ;;
              *)
                exit 1 ;;
            esac
          fi

  python:
    name: python
    needs: detect
    if: fromJSON(needs.detect.outputs.versions).python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    env:
      VERSION: ${{ fromJSON(needs.detect.outputs.versions).python }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set version
        run: |
          set -eu
          # Only the [project] version, which is the first `version = ` in the file.
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" pyproject.toml
          grep -m1 '^version = ' pyproject.toml

      - run: pip install build

      # Note the version PyPI ends up carrying is PEP 440 normalised - "5.11.0-beta.13" is stored
      # and installed as "5.11.0b13".
      - run: python -m build

      # Betas and stable releases both; `pip install` skips a pre-release unless asked with --pre.
      # Authenticates over OIDC against the trusted publisher configured on PyPI. No token exists.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  ruby:
    name: ruby
    needs: detect
    if: fromJSON(needs.detect.outputs.versions).ruby
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    env:
      VERSION: ${{ fromJSON(needs.detect.outputs.versions).ruby }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby

      # lib/habarico/version.rb reads the VERSION file, and the gemspec reads that.
      - name: Set version
        run: echo "$VERSION" > VERSION

      - name: Build the gem
        run: |
          set -eu
          # Read the file name out of `gem build` rather than composing it from $VERSION:
          # Gem::Version normalises a pre-release, so "0.57.0-beta.10" is written to disk as
          # habarico-0.57.0.pre.beta.10.gem and name-$VERSION would not exist.
          GEM_FILE=$(gem build habarico.gemspec | awk '/File:/ {print $2}')
          if [ -z "$GEM_FILE" ] || [ ! -f "$GEM_FILE" ]; then
            echo "ERROR: gem build produced no file"
            exit 1
          fi
          echo "GEM_FILE=$GEM_FILE" >> "$GITHUB_ENV"
          echo "built $GEM_FILE"

      # Exchanges the OIDC token for a short-lived RubyGems API key. No long-lived key exists.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v1

      # Betas and stable releases both. `gem install` skips a pre-release unless asked with --pre.
      - name: Publish to rubygems.org
        run: |
          set -eu
          if OUTPUT=$(gem push "$GEM_FILE" 2>&1); then
            echo "$OUTPUT"
          else
            echo "$OUTPUT"
            case "$(echo "$OUTPUT" | tr '[:upper:]' '[:lower:]')" in
              *"repushing of gem versions is not allowed"*)
                echo "this version is already on rubygems.org - continuing" ;;
              *)
                exit 1 ;;
            esac
          fi
