# The only workflow that publishes anything. Betas come from a push to the trunk, stable releases
# from a release tag; both go through the same jobs so they cannot drift apart. Keeping it in one
# file also keeps the trusted-publisher configuration in all three registries identical - they
# match on the workflow filename. See .github/RELEASE-DESIGN.md.
#
# A failed publish job is retried with workflow_dispatch, not with "Re-run": a re-run uses the
# workflow file of the commit it first ran on, so a fix to this file would never reach it.
#
# Betas and stable releases go to the public registries only: python to PyPI, ruby to
# rubygems.org, node to npmjs.com. See "Going public" in .github/README.md.
name: Publish

on:
  push:
    # Betas. A merge to next does not publish by itself - beta-bump.yml commits a version bump for
    # every library that moved, and it is THAT push (matched by the detect job's `if:` below) that
    # reaches the publish logic. The merge's own run of this workflow is a no-op.
    #
    # Hard-coded, unlike everything else here: `on:` is evaluated before any context exists, so
    # neither `vars` nor `env` can be used in a trigger. Renaming the trunk means editing this line
    # and the matching ones in release.yml and beta-bump.yml.
    branches:
      - next
    # Stable releases, pushed by release.yml.
    tags:
      - "*@*"
  # Publishes one library again at the version its file carries on the chosen ref: the trunk for a
  # beta, the `<lib>@X.Y.Z` tag for a stable release. Registries skip a version they already have.
  workflow_dispatch:
    inputs:
      library:
        description: "Library to publish"
        type: choice
        options:
          - node
          - python
          - ruby

# Never cancel a publish half-way. An interrupted upload is the one failure mode that cannot be
# retried cleanly.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    # Carries pydev, which reads each library's version file through its .pydev/base.yml.
    # The upstream image is public, so nothing has to be configured for this to run; set the
    # TOOLBOX_IMAGE variable only to try a different build. It is Alpine-based - the runner
    # mounts its musl Node build for the JavaScript actions, which is why they work here.
    container: ${{ vars.TOOLBOX_IMAGE || 'ghcr.io/druids/developers-chamber:1' }}
    # A tag always names an exact release - no further check needed. A branch push only reaches
    # here when beta-bump.yml's own commit named a prerelease; an ordinary merge and release.yml's
    # finalize commit fail this and the run does nothing. A manual run
    # is checked by the detect step itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (startsWith(github.event.head_commit.message, 'Bump version to') &&
       (contains(github.event.head_commit.message, '-alpha.') ||
        contains(github.event.head_commit.message, '-beta.') ||
        contains(github.event.head_commit.message, '-rc.')))
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A push to the branch only diffs HEAD against its parent and a tag needs no history; a
          # manual run on the branch looks for the library's last bump commit in the whole log.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && '0' || '2' }}

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: detect
        env:
          # Empty on a push.
          LIBRARY: ${{ inputs.library }}
        run: |
          set -eu

          # A tag names both the library and the exact version - nothing to derive.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            LIB="${GITHUB_REF_NAME%@*}"
            VER="${GITHUB_REF_NAME##*@}"
            if [ -n "$LIBRARY" ] && [ "$LIBRARY" != "$LIB" ]; then
              echo "ERROR: tag $GITHUB_REF_NAME releases $LIB, not $LIBRARY"
              exit 1
            fi
            echo "  $LIB: $VER (from tag)"
            python3 -c "import json,sys; print('versions=' + json.dumps({sys.argv[1]: sys.argv[2]}))" \
              "$LIB" "$VER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : > /tmp/publish.txt
          if [ -n "$LIBRARY" ]; then
            # The version file only names what was built when nothing in the directory moved since
            # the bump commit that wrote it - anything newer is beta-bump.yml's to number.
            BASE=$(git log -1 --format=%H --grep '^Bump version to' -- "$LIBRARY/" || true)
            if [ -z "$BASE" ] || ! git --no-optional-locks diff --quiet "$BASE" HEAD -- "$LIBRARY/"; then
              echo "ERROR: $LIBRARY/ has changed since its last bump commit${BASE:+ $BASE} - its version file does not describe this code"
              exit 1
            fi

            VERSION=$(cd "$LIBRARY" && pydev version print)
            case "$VERSION" in
              *-alpha.*|*-beta.*|*-rc.*)
                echo "  $LIBRARY: $VERSION (manual run on $GITHUB_REF_NAME)"
                echo "${LIBRARY} ${VERSION}" >> /tmp/publish.txt
                ;;
              *)
                echo "ERROR: $LIBRARY is on $VERSION, not a prerelease - publish a stable release by running this workflow on its tag $LIBRARY@$VERSION"
                exit 1
                ;;
            esac
          else
            . .github/scripts/libraries.sh
            list_libs

            # A branch push only reaches this point when it is beta-bump.yml's own commit (the `if:`
            # above filtered everything else out), so this exact commit named which libraries it
            # bumped and each one's version file already carries the version to publish - nothing to
            # derive, just read it back per library this commit actually touched.
            for lib in $LIBS; do
              if git --no-optional-locks diff --quiet HEAD~1 HEAD -- "$lib/"; then
                echo "  $lib: not touched by this commit, skipping"
                continue
              fi

              VERSION=$(cd "$lib" && pydev version print)
              case "$VERSION" in
                *-alpha.*|*-beta.*|*-rc.*)
                  echo "  $lib: $VERSION"
                  echo "${lib} ${VERSION}" >> /tmp/publish.txt
                  ;;
                *)
                  # Defensive: the job-level `if:` already guarantees this commit names a prerelease
                  # somewhere, but not necessarily in every library it touched.
                  echo "  $lib: touched, but its version carries no prerelease marker ($VERSION) - skipping"
                  ;;
              esac
            done

          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('/tmp/publish.txt') as f:
              pairs = dict(line.split() for line in f if line.strip())
          print('versions=' + json.dumps(pairs))
          PY

  node:
    name: node
    needs: detect
    if: fromJSON(needs.detect.outputs.versions).node
    runs-on: ubuntu-latest
    # Pinned in the npm trusted publisher configuration.
    environment: release
    permissions:
      contents: read
      # Required for OIDC trusted publishing on npmjs.com; also what makes npm attach provenance.
      id-token: write
    defaults:
      run:
        working-directory: node
    env:
      VERSION: ${{ fromJSON(needs.detect.outputs.versions).node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node/package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships something recent enough today,
      # but the publish is not the place to find out that it stopped being true.
      - run: npm install -g npm@latest

      - run: npm ci

      # A beta version is derived, never committed, so the file has to be told what it is. Stable
      # releases pass the version the tag already carries, hence --allow-same-version.
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - run: npm run build

      # Betas and stable releases both go to npmjs.com, betas under the `beta` dist-tag.
      - name: Publish to npmjs.com
        run: |
          set -eu
          # npm refuses to publish a pre-release without an explicit --tag: it would otherwise move
          # the "latest" dist-tag onto a beta.
          # A stable release takes "latest" only from a lower version: a patch of an older series
          # gets the tag of its series (`release-7.1`; `v7.1` would be rejected as a semver range).
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*) DIST_TAG=beta ;;
            *)
              CURRENT=$(npm view habarico dist-tags.latest --registry=https://registry.npmjs.org/ 2>/dev/null || true)
              HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
              if [ -z "$CURRENT" ] || [ "$HIGHEST" = "$VERSION" ]; then
                DIST_TAG=latest
              else
                DIST_TAG="release-$(echo "$VERSION" | cut -d. -f1,2)"
              fi
              echo "latest on npmjs.com: ${CURRENT:-none}, publishing $VERSION under \"$DIST_TAG\""
              ;;
          esac

          if OUTPUT=$(npm publish --registry=https://registry.npmjs.org/ --provenance --access public --tag "$DIST_TAG" 2>&1); then
            echo "$OUTPUT"
          else
            echo "$OUTPUT"
            # Re-publishing a version is not an error: a retried job lands here.
            case "$(echo "$OUTPUT" | tr '[:upper:]' '[:lower:]')" in
              *epublishconflict*|*"cannot publish over"*)
                echo "this version is already on npmjs.com - continuing" ;;
              *)
                exit 1 ;;
            esac
          fi

  python:
    name: python
    needs: detect
    if: fromJSON(needs.detect.outputs.versions).python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    env:
      VERSION: ${{ fromJSON(needs.detect.outputs.versions).python }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set version
        run: |
          set -eu
          # Only the [project] version, which is the first `version = ` in the file.
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" pyproject.toml
          grep -m1 '^version = ' pyproject.toml

      - run: pip install build

      # Note the version PyPI ends up carrying is PEP 440 normalised - "5.11.0-beta.13" is stored
      # and installed as "5.11.0b13".
      - run: python -m build

      # Betas and stable releases both; `pip install` skips a pre-release unless asked with --pre.
      # Authenticates over OIDC against the trusted publisher configured on PyPI. No token exists.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  ruby:
    name: ruby
    needs: detect
    if: fromJSON(needs.detect.outputs.versions).ruby
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    env:
      VERSION: ${{ fromJSON(needs.detect.outputs.versions).ruby }}
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby

      # lib/habarico/version.rb reads the VERSION file, and the gemspec reads that.
      - name: Set version
        run: echo "$VERSION" > VERSION

      - name: Build the gem
        run: |
          set -eu
          # Read the file name out of `gem build` rather than composing it from $VERSION:
          # Gem::Version normalises a pre-release, so "0.57.0-beta.10" is written to disk as
          # habarico-0.57.0.pre.beta.10.gem and name-$VERSION would not exist.
          GEM_FILE=$(gem build habarico.gemspec | awk '/File:/ {print $2}')
          if [ -z "$GEM_FILE" ] || [ ! -f "$GEM_FILE" ]; then
            echo "ERROR: gem build produced no file"
            exit 1
          fi
          echo "GEM_FILE=$GEM_FILE" >> "$GITHUB_ENV"
          echo "built $GEM_FILE"

      # Exchanges the OIDC token for a short-lived RubyGems API key. No long-lived key exists.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      # Betas and stable releases both. `gem install` skips a pre-release unless asked with --pre.
      - name: Publish to rubygems.org
        run: |
          set -eu
          if OUTPUT=$(gem push "$GEM_FILE" 2>&1); then
            echo "$OUTPUT"
          else
            echo "$OUTPUT"
            case "$(echo "$OUTPUT" | tr '[:upper:]' '[:lower:]')" in
              *"repushing of gem versions is not allowed"*)
                echo "this version is already on rubygems.org - continuing" ;;
              *)
                exit 1 ;;
            esac
          fi

  # A stable tag gets a GitHub Release once its library is in the registry. Release-scoped
  # credentials are not needed, so it runs outside the `release` environment.
  github-release:
    name: github-release
    needs: [detect, node, python, ruby]
    # Only the library the tag names ran; the other two were skipped.
    if: >-
      !cancelled() &&
      github.ref_type == 'tag' &&
      !contains(github.ref_name, '-') &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Create or update the release
        run: |
          set -eu
          LIB="${TAG%@*}"
          VER="${TAG##*@}"

          case "$LIB" in
            node) PACKAGE_URL="https://www.npmjs.com/package/habarico/v/$VER" ;;
            python) PACKAGE_URL="https://pypi.org/project/habarico/$VER/" ;;
            ruby) PACKAGE_URL="https://rubygems.org/gems/habarico/versions/$VER" ;;
            *) echo "ERROR: no registry known for $LIB"; exit 1 ;;
          esac

          # The notes are the section release.yml stamped, below "## [X.Y.Z]" up to the next heading
          # of that level. GitHub refuses a body over 125,000 characters, and a section of a major
          # outgrows it: over MAX_CHARS it is cut before an entry outside a code fence and ends
          # with a link to the full changelog in the tag.
          LIB="$LIB" VER="$VER" PACKAGE_URL="$PACKAGE_URL" python3 - <<'PY' > /tmp/notes.md
          import os, sys

          MAX_CHARS = 30000

          lib, version = os.environ["LIB"], os.environ["VER"]
          section, found = [], False
          with open(f"{lib}/CHANGELOG.md", encoding="utf-8") as changelog:
              for line in changelog.read().splitlines():
                  if line.startswith(f"## [{version}]"):
                      found = True
                  elif found and line.startswith("## "):
                      break
                  elif found:
                      section.append(line)
          while section and not section[0].strip():
              section.pop(0)
          if not "".join(section).strip():
              sys.exit(f"ERROR: {lib}/CHANGELOG.md has no section for {version}")

          footer = "\n\nPackage: " + os.environ["PACKAGE_URL"]
          notes = "\n".join(section).rstrip()
          if len(notes) + len(footer) > MAX_CHARS:
              url = "{}/{}/blob/{}/{}/CHANGELOG.md".format(
                  os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["TAG"], lib
              )
              suffix = f"\n\n…\n\n*Truncated - the full changelog is in [{lib}/CHANGELOG.md]({url}).*"
              budget = MAX_CHARS - len(suffix) - len(footer)

              # The last line within the budget that starts an entry, and any line outside a fence
              # as a fallback when no entry boundary fits.
              cut, fallback, used, in_fence = 0, 0, 0, False
              for index, line in enumerate(section):
                  if used > budget:
                      break
                  if not in_fence:
                      fallback = index
                      if line.startswith(("- ", "### ")):
                          cut = index
                  if line.lstrip().startswith(("```", "~~~")):
                      in_fence = not in_fence
                  used += len(line) + 1
              kept = section[: cut or fallback]
              # A heading left without its entries says nothing.
              while kept and (not kept[-1].strip() or kept[-1].startswith("#")):
                  kept.pop()
              notes = "\n".join(kept) + suffix
              print(f"{lib} {version}: section truncated to {len(notes)} characters", file=sys.stderr)

          print(notes + footer)
          PY

          # "Latest" belongs to node, and only to its newest stable release: a patch on an older
          # series must not take it from the current one.
          NEWEST=$(git ls-remote --tags --refs origin 'refs/tags/node@*' \
            | sed 's|.*refs/tags/node@||' | { grep -v -e '-' || true; } | sort -V | tail -1)
          if [ "$LIB" = node ] && [ "$VER" = "$NEWEST" ]; then
            LATEST=true
          else
            LATEST=false
          fi

          # A manual retry of publish.yml on the tag lands here a second time.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md --latest="$LATEST"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md --latest="$LATEST"
          fi
