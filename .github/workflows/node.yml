# Checks of the Node library (ci-toolbox/node-library@2 plus storybook-tests). This workflow only runs checks; publishing lives in publish.yml - see .github/WORKFLOWS.md.
name: Node

# Every pull request runs every library's checks, so each job reports a status the `next` ruleset
# can require; a workflow skipped by a `paths` filter would leave that check pending forever.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the previous run rather than queueing behind it.
concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: node

env:
  # NODE_VERSION from ci-toolbox/node-library@2. The repo pins nothing of its own.
  NODE_VERSION: "24"

jobs:
  node-code-quality:
    name: node-code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Runs tsc with --max-old-space-size=4096; the hosted runner has 16 GB.
      - name: Typecheck
        run: npm run typecheck

  node-unit-tests:
    name: node-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - run: npm ci

      # `vitest run --project=unit` plus `npm run test:scripts` (the uploader's `node --test`
      # suite). The storybook project is exercised by the job below.
      - run: npm test

  node-storybook-tests:
    name: node-storybook-tests
    runs-on: ubuntu-latest
    # A wedged Chromium produces no output at all. The suite itself takes ~2 minutes, so cap the
    # job and fail fast instead of waiting out the default 6-hour limit.
    timeout-minutes: 20
    env:
      # Nothing here needs to phone home, and it is one less thing to fail on a slow network.
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - run: npm ci

      # Only chromium is fetched - see the `instances` list in vitest.config.ts - which keeps
      # this well under a minute. --with-deps adds the shared libraries Chromium needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Renders every exported story in headless Chromium and fails if one throws. Measured peak
      # for the whole process tree is ~3.2 GB, comfortably inside the runner's 16 GB.
      - name: Story tests
        run: npm run test:storybook

      # Still worth its own step: @storybook/addon-vitest runs with `disableAddonDocs`, so the
      # autodocs/MDX side of the build is the one thing the story tests above do not exercise.
      - name: Build Storybook
        run: npm run build-storybook

      # On failure vitest writes a screenshot of the story that failed next to it
      # (`browser.screenshotFailures` in vitest.config.ts).
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-screenshots
          path: node/src/**/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

  # A manual run also packs the branch into a tarball, to try it in another project without
  # publishing anything: `npm install ./habarico-<version>.tgz`. See .github/OPERATIONS.md.
  node-pack:
    name: node-pack
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - run: npm ci

      # `X.Y.Z-dev-<sha>` never collides with a published beta. One hyphenated identifier, because
      # semver rejects a numeric one with a leading zero, which a bare sha can be.
      - name: Set version
        run: |
          set -eu
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="$BASE-dev-${GITHUB_SHA::7}"
          npm version --no-git-tag-version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm run build

      - run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: habarico-${{ env.VERSION }}
          path: node/habarico-${{ env.VERSION }}.tgz
          if-no-files-found: error
